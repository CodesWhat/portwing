name: "Release: Cut"
run-name: "Release: Cut — manual by ${{ github.actor }}"

# Requires RELEASE_PAT secret (fine-grained PAT, Contents: RW on this repo).
# GITHUB_TOKEN-pushed tags do not trigger downstream workflows under
# default_workflow_permissions; the PAT is needed so the v* tag push
# fires release.yml automatically.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit release version, e.g. 0.2.0 or v0.2.0. Leave blank to auto-compute from conventional commits since the last tag."
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: release-cut
  cancel-in-progress: false

env:
  CI_WORKFLOW_FILE: ci-verify.yml

jobs:
  cut:
    name: "Release: Cut Tag"
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      actions: read
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.RELEASE_PAT }}

      - name: Resolve target SHA
        id: target
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Target SHA: ${sha}"

      - name: Require target SHA on main
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "${TARGET_SHA}" origin/main; then
            echo "::error::Release target ${TARGET_SHA} is not on origin/main."
            exit 1
          fi

      - name: Verify successful CI on target SHA
        uses: ./.github/actions/verify-ci-success
        with:
          workflow-file: ${{ env.CI_WORKFLOW_FILE }}
          target-sha: ${{ steps.target.outputs.sha }}
          max-attempts: "76"
          github-token: ${{ github.token }}

      - name: Find latest release tag
        id: base
        run: |
          set -euo pipefail
          latest_tag="$(git tag --list 'v*' --sort=-v:refname | awk '!/-/' | head -n1)"
          if [ -z "${latest_tag}" ]; then
            latest_tag="v0.0.0"
          fi
          echo "latest_tag=${latest_tag}" >> "$GITHUB_OUTPUT"
          echo "current_version=${latest_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Compute next version
        id: next
        env:
          LATEST_TAG: ${{ steps.base.outputs.latest_tag }}
          CURRENT_VERSION: ${{ steps.base.outputs.current_version }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${VERSION_INPUT}" ]; then
            # Explicit override: normalize an optional leading "v" and validate semver.
            next_version="${VERSION_INPUT#v}"
            if ! echo "${next_version}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Invalid version '${VERSION_INPUT}'. Expected MAJOR.MINOR.PATCH (optionally v-prefixed)."
              exit 1
            fi
            bump="manual"
          else
            # Determine bump level from conventional commits since last tag.
            # feat = minor bump, fix/anything else = patch bump.
            # A "!" before ":" in the commit subject = major bump (body/footer
            # not read). Only subjects matching the full header grammar count:
            # optional legacy emoji prefix (non-ASCII run + whitespace, so
            # pre-migration gitmoji history still computes), then a known
            # type, optional scope, optional "!", then ":". Anything else —
            # "urgent!: x", "feature: x" — is ignored, not misclassified.
            header_prefix='^([^ -~]+[[:space:]]+)?'
            header_types='(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)'
            header_scope='(\([A-Za-z0-9._/-]+\))?'
            bump="patch"
            while IFS= read -r subject; do
              if echo "${subject}" | grep -qE "${header_prefix}${header_types}${header_scope}!:[[:space:]]"; then
                bump="major"
                break
              elif echo "${subject}" | grep -qE "${header_prefix}feat${header_scope}!?:[[:space:]]"; then
                if [ "${bump}" != "major" ]; then
                  bump="minor"
                fi
              fi
            done < <(git log --format=%s "${LATEST_TAG}..${TARGET_SHA}" 2>/dev/null || true)

            IFS='.' read -r major minor patch <<< "${CURRENT_VERSION:-0.0.0}"
            case "${bump}" in
              major) major=$((major+1)); minor=0; patch=0 ;;
              minor) minor=$((minor+1)); patch=0 ;;
              patch) patch=$((patch+1)) ;;
            esac
            next_version="${major}.${minor}.${patch}"
          fi

          release_tag="v${next_version}"

          if git rev-parse -q --verify "refs/tags/${release_tag}" >/dev/null; then
            echo "::error::Tag already exists: ${release_tag}"
            exit 1
          fi

          {
            echo "release_level=${bump}"
            echo "next_version=${next_version}"
            echo "release_tag=${release_tag}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate CHANGELOG entry for release tag
        env:
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
        run: |
          set -euo pipefail
          if ! grep -q "## \[${RELEASE_TAG}\]\|## \[${RELEASE_TAG#v}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG has no entry for ${RELEASE_TAG}. Add release notes before cutting a tag."
            exit 1
          fi
          # Verify the entry is non-empty (has at least one non-heading line after it).
          # Use [^[:space:]] rather than \S: mawk (the default awk on the ubuntu
          # runners) has no Perl character classes and reads \S as a literal "S",
          # so the check silently passed only for entries that happened to contain
          # a capital S and failed for ones that did not.
          awk "/## \[${RELEASE_TAG}\]|## \[${RELEASE_TAG#v}\]/{found=1; next} found && /^## /{exit} found && /[^[:space:]]/{ok=1; exit} END{exit ok ? 0 : 1}" CHANGELOG.md || {
            echo "::error::CHANGELOG entry for ${RELEASE_TAG} appears empty. Add content before cutting a tag."
            exit 1
          }
          echo "Validated CHANGELOG entry for ${RELEASE_TAG}."

      # The check above finds the tag's entry anywhere in the file, so cutting a
      # tag whose notes are buried under newer ones would pass it. That matters
      # because scripts/package-release-config-test.sh derives the version it
      # polices from the NEWEST dated heading: if the tag being cut isn't that
      # heading, the contract is asserting a different release than the one
      # about to ship, and both gates go green while disagreeing.
      - name: Require the release tag to be the newest CHANGELOG entry
        env:
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
        run: |
          set -euo pipefail
          # `|| true` matters: with no matching heading grep exits 1, pipefail
          # propagates it, and set -e kills the step at the assignment — so the
          # explicit error below, and its ${newest:-none} fallback, would never
          # run. The bare failure looks like a broken workflow rather than a
          # missing changelog entry.
          newest="$(grep -E '^## \[v[0-9]+\.[0-9]+\.[0-9]+\] - [0-9]{4}-[0-9]{2}-[0-9]{2}$' CHANGELOG.md \
            | sed -n '1p' | sed -E 's/^## \[(v[0-9.]+)\].*/\1/' || true)"
          if [ "${newest}" != "${RELEASE_TAG}" ]; then
            echo "::error::Cutting ${RELEASE_TAG} but CHANGELOG's newest dated entry is ${newest:-none}. The package release contract polices ${newest:-none}, so the docs would be verified against a different release than the one being tagged."
            exit 1
          fi
          echo "${RELEASE_TAG} is the newest CHANGELOG entry."

      - name: Verify the package release contract against the tag
        run: bash scripts/package-release-config-test.sh

      - name: Create and push release tag
        env:
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "${RELEASE_TAG}" "${TARGET_SHA}" -m "release: ${RELEASE_TAG}"
          git push origin "${RELEASE_TAG}"

      - name: Release summary
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          RELEASE_LEVEL: ${{ steps.next.outputs.release_level }}
          NEXT_VERSION: ${{ steps.next.outputs.next_version }}
          RELEASE_TAG: ${{ steps.next.outputs.release_tag }}
        run: |
          {
            echo "### Release Cut Summary"
            echo "- Target SHA: \`${TARGET_SHA}\`"
            echo "- Bump level: \`${RELEASE_LEVEL}\`"
            echo "- Next version: \`${NEXT_VERSION}\`"
            echo "- Tag: \`${RELEASE_TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"
