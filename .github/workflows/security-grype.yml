name: "Security: Grype & Gosec"
run-name: >-
  ${{
    github.event_name == 'schedule' && 'Security: Grype & Gosec — Weekly run' ||
    github.event_name == 'pull_request' && format('Security: Grype & Gosec — PR #{0}', github.event.pull_request.number) ||
    format('Security: Grype & Gosec — Manual by {0}', github.actor)
  }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'dev/**']
    # Deliberately NOT path-filtered. "Security: Gosec SAST" and
    # "Security: Grype Dependency Scan (Go + npm)" are required contexts on
    # main, and a required check that only reports on some PR shapes blocks
    # every PR that does not match the filter — GitHub waits forever for a
    # status that will never arrive. The old filter scoped runs to Go/dep/
    # build paths, so a docs-only or website-only PR produced no run at all.
    # If these jobs ever get slow enough that doc-only PRs suffer, gate the
    # expensive STEPS on a path check inside the job, never the workflow
    # trigger, so the check still reports.
  schedule:
    - cron: '15 7 * * 1'  # Weekly on Monday at 07:15 UTC

permissions:
  contents: read

concurrency:
  group: security-grype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grype-image:
    name: ${{ matrix.name }}
    # Image build is the heavy step; keep it on scheduled/manual runs.
    # PRs get fast, accurate dependency coverage from grype-deps here plus
    # the required "Go CI / Govulncheck" context, without paying for a
    # Docker build on every push.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Security: Grype Container Scan"
            platform: linux/amd64
            dockerfile: Dockerfile
            category: grype-image
            fail-build: true
          - name: "Security: Grype ARM64 Container Scan"
            platform: linux/arm64
            dockerfile: Dockerfile
            category: grype-image-arm64
            fail-build: true
          - name: "Security: Grype ARMv7 Container Scan"
            platform: linux/arm/v7
            dockerfile: Dockerfile.armv7
            category: grype-image-armv7
            fail-build: true
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            codeload.github.com:443
            dl-cdn.alpinelinux.org:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            docker-images-prod.s3.dualstack.us-west-2.amazonaws.com:443
            download.docker.com:443
            get.anchore.io:443
            github.com:443
            grype.anchore.io:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        if: matrix.platform != 'linux/amd64'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
        with:
          platforms: arm,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: portwing:grype-scan
          # Keep the vulnerability scan honest: cached apk-install layers can
          # preserve stale distro packages after Alpine publishes fixes.
          no-cache: true

      - name: Verify static clients and HTTP/TLS health checks
        env:
          IMAGE_PLATFORM: ${{ matrix.platform }}
        run: python3 scripts/armv7-image-smoke.py portwing:grype-scan "${IMAGE_PLATFORM}"

      - name: Verify scoped scanner exclusions are not linked
        run: |
          container_id="$(docker create portwing:grype-scan)"
          trap 'docker rm -f "${container_id}" >/dev/null' EXIT
          docker cp "${container_id}:/usr/bin/portwing" /tmp/portwing
          docker cp "${container_id}:/usr/bin/docker-compose" /tmp/docker-compose
          ./scripts/verify-scanner-exclusions.sh /tmp/portwing /tmp/docker-compose

      - name: Verify Compose embeds the pinned containerd
        # Read actual linked module versions; recipe pins alone are insufficient.
        env:
          GOTOOLCHAIN: local
          COMPOSE_DOCKERFILE: ${{ matrix.dockerfile }}
        run: ./scripts/ci/verify-compose-containerd.sh /tmp/docker-compose "${COMPOSE_DOCKERFILE}"

      - name: Verify Compose embeds patched compression dependency
        env:
          GOTOOLCHAIN: local
          COMPOSE_DOCKERFILE: ${{ matrix.dockerfile }}
        run: ./scripts/ci/verify-compose-containerd.sh /tmp/docker-compose "${COMPOSE_DOCKERFILE}" github.com/klauspost/compress

      - name: Verify Compose embeds patched OpenTelemetry SDK and trace
        env:
          GOTOOLCHAIN: local
          COMPOSE_DOCKERFILE: ${{ matrix.dockerfile }}
        run: |
          ./scripts/ci/verify-compose-containerd.sh /tmp/docker-compose "${COMPOSE_DOCKERFILE}" go.opentelemetry.io/otel/sdk
          ./scripts/ci/verify-compose-containerd.sh /tmp/docker-compose "${COMPOSE_DOCKERFILE}" go.opentelemetry.io/otel/trace

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        id: grype
        with:
          image: portwing:grype-scan
          severity-cutoff: high
          fail-build: ${{ matrix.fail-build }}
          output-format: sarif
          config: .grype.yaml

      - name: Upload Grype SARIF to code scanning
        # Code scanning uploads require GHAS, not available on free private repos.
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: ${{ matrix.category }}

      - name: Summarize
        if: always()
        env:
          SCAN_PLATFORM: ${{ matrix.platform }}
        run: |
          {
            echo "### Grype Container Scan (${SCAN_PLATFORM})"
            echo "- Scanned the built image (binary build-info → real shipped deps) for HIGH/CRITICAL CVEs"
            echo "- Base image: Alpine certificates/metadata with official static Docker and source-built Compose clients on amd64, arm64 and ARMv7; all FROM scratch"
          } >> "$GITHUB_STEP_SUMMARY"

  grype-deps:
    name: "Security: Grype Dependency Scan (Go + npm)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          # dl.google.com and go.dev are for setup-go below, which the
          # source-level exclusion check needs a toolchain for.
          allowed-endpoints: >
            api.github.com:443
            dl.google.com:443
            get.anchore.io:443
            github.com:443
            go.dev:443
            grype.anchore.io:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Depth 2 so a PR's merge commit has both parents, which the web
          # toolchain gate diffs.
          fetch-depth: 2

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Reads the exact `toolchain` directive from go.mod (setup-go honors
          # toolchain over the `go` line), so the check runs on the same pinned,
          # patched toolchain the binary is built with — one source of truth.
          go-version-file: go.mod

      - name: Verify scoped scanner exclusions are not imported
        # Lives here, not in grype-image, because grype-image carries
        # `if: github.event_name != 'pull_request'` and always skips on PRs.
        # This is the source-level half of the check (`go list -deps -test`);
        # grype-image runs the binary-linkage half with path arguments. This
        # job is the only PR-time home for it, and it moved here when the
        # duplicate govulncheck job was retired.
        run: ./scripts/verify-scanner-exclusions.sh

      - name: Install yq
        # The waiver expiry check reads .grype.yaml with a real YAML parser.
        # Pinned by version and SHA-256 rather than trusting the runner image's
        # copy. github.com and release-assets.githubusercontent.com are already
        # in the egress allow-list above.
        env:
          YQ_VERSION: '4.54.3'
          YQ_LINUX_AMD64_SHA256: '129534601871538efe0ba4c5e62a34fb1d5f469bcb975c4fddeb467d82974973'
        run: |
          set -euo pipefail

          install_dir="${RUNNER_TEMP}/yq-bin"
          mkdir -p "${install_dir}"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --silent --show-error --location \
            "https://github.com/mikefarah/yq/releases/download/v${YQ_VERSION}/yq_linux_amd64" \
            --output "${install_dir}/yq"
          printf '%s  %s\n' "${YQ_LINUX_AMD64_SHA256}" "${install_dir}/yq" | sha256sum --check --strict
          chmod +x "${install_dir}/yq"
          "${install_dir}/yq" --version
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Enforce waiver expiry
        # Grype has no expiry field, so a waiver would suppress its finding
        # forever. This fails the job once any `expires: YYYY-MM-DD` in
        # .grype.yaml is today (UTC) or past, before either scan runs, on every
        # event.
        run: ./scripts/check-grype-waiver-expiry.sh .grype.yaml

      - name: Run Grype on the shipped surface (Go modules)
        # The hard gate. Go modules, binaries and images are what users run, so
        # a HIGH finding here fails every PR shape. Scanning the repo root
        # catalogs go.mod/go.sum; grype matches the lockfile-resolved versions
        # (not the full module requirement graph), so it does not emit the
        # phantom-dependency findings a manifest-graph SCA reports for modules
        # the binary never links in.
        #
        # npm content is excluded by .grype-shipped.yaml, layered on top of
        # .grype.yaml (scan-action accepts several config files, newline
        # separated, and grype merges them), so the Go suppressions stay in one
        # file. This job never runs `npm ci`, so node_modules (native toolchain
        # binaries such as the TypeScript compiler) is absent on CI and is never
        # scanned; the exclusion keeps it out for local runs and if an install
        # step is ever added.
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        id: grype-deps
        with:
          path: .
          severity-cutoff: high
          fail-build: true
          output-format: sarif
          config: |
            .grype.yaml
            .grype-shipped.yaml

      - name: Upload Grype dependency SARIF
        if: always() && github.event.repository.visibility == 'public' && steps.grype-deps.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: ${{ steps.grype-deps.outputs.sarif }}
          category: grype-deps

      - name: Decide whether web toolchain findings fail this run
        # The website and docs build toolchain (the npm lockfile) never ships in
        # the agent binary or the image, so its advisories must not block
        # unrelated PRs. They fail the job only when the PR itself changes npm
        # dependencies, and on scheduled and manual runs. The decision is made
        # here, inside the job, from the PR diff; the workflow trigger stays
        # unfiltered so this required check reports on every PR shape.
        #
        # On a pull_request event HEAD is GitHub's merge commit, so HEAD^1 is
        # the base branch tip the PR merges into and the first-parent diff is
        # exactly the PR's change set. Checkout above fetches depth 2 so both
        # parents exist. Anything unexpected fails closed (enforce).
        id: web-gate
        if: always()
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          enforce=true
          reason="event ${EVENT_NAME}: web toolchain findings always fail"
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            if git rev-parse --verify --quiet 'HEAD^2' >/dev/null && git rev-parse --verify --quiet 'HEAD^1' >/dev/null; then
              changed="$(git diff --name-only --no-renames 'HEAD^1' HEAD)"
              npm_changes=""
              while IFS= read -r file; do
                case "${file}" in
                  package.json | package-lock.json | */package.json | */package-lock.json)
                    npm_changes="${npm_changes}${file} "
                    ;;
                  *) ;;
                esac
              done <<<"${changed}"
              if [ -n "${npm_changes}" ]; then
                reason="PR changes npm dependency files: ${npm_changes}"
              else
                enforce=false
                reason="PR changes no package.json or package-lock.json"
              fi
            else
              reason="could not compute the PR diff (HEAD is not a merge commit); failing closed"
            fi
          fi
          echo "enforce=${enforce}" >> "$GITHUB_OUTPUT"
          echo "reason=${reason}" >> "$GITHUB_OUTPUT"
          echo "Web toolchain gate: enforce=${enforce} (${reason})"

      - name: Stage the npm lockfile for the web toolchain scan
        # Only the lockfile is scanned, from a copy outside the workspace, so
        # nothing else in the tree can widen it. The Go step above is the
        # only one that reads the repo root.
        if: always()
        run: |
          mkdir -p "${RUNNER_TEMP}/web-lock"
          cp package-lock.json "${RUNNER_TEMP}/web-lock/package-lock.json"

      - name: Run Grype on the web toolchain lockfile (npm)
        # fail-build follows the gate above: true on npm-changing PRs and on
        # schedule/dispatch, false otherwise. With false, scan-action turns a
        # HIGH finding into a warning annotation instead of failing the job.
        # .grype.yaml carries the expiring picomatch waiver.
        if: always()
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        id: grype-web
        with:
          path: ${{ runner.temp }}/web-lock
          severity-cutoff: high
          fail-build: ${{ steps.web-gate.outputs.enforce }}
          output-format: sarif
          config: .grype.yaml

      - name: Upload Grype web toolchain SARIF
        if: always() && github.event.repository.visibility == 'public' && steps.grype-web.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: ${{ steps.grype-web.outputs.sarif }}
          # The scan ran on a staged copy, so findings carry absolute paths
          # under it. Relativize them against that copy so they resolve to the
          # tracked package-lock.json.
          checkout_path: ${{ runner.temp }}/web-lock
          category: grype-web

      - name: Summarize
        if: always()
        env:
          WEB_SARIF: ${{ steps.grype-web.outputs.sarif }}
          WEB_ENFORCE: ${{ steps.web-gate.outputs.enforce }}
          WEB_REASON: ${{ steps.web-gate.outputs.reason }}
        run: |
          {
            echo "### Grype Dependency Scan (Go + npm)"
            echo "- Shipped surface (hard gate): Go modules scanned for HIGH/CRITICAL CVEs on every run; npm content excluded via .grype-shipped.yaml"
            echo "- Matches lockfile-resolved versions (no module-graph false positives)"
            echo "- Web toolchain (package-lock.json only): fails the job on PRs that change a package.json or package-lock.json, and on scheduled and manual runs; otherwise findings are reported as warnings"
            echo "- Web toolchain gate this run: enforce=${WEB_ENFORCE:-unknown} (${WEB_REASON:-not computed})"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${WEB_SARIF:-}" ] && [ -f "${WEB_SARIF}" ]; then
            high="$(jq '[.runs[].results[]? | select(.level == "error")] | length' "${WEB_SARIF}")"
            echo "- Web toolchain HIGH/CRITICAL findings after waivers: ${high}" >> "$GITHUB_STEP_SUMMARY"
            if [ "${high}" != "0" ] && [ "${WEB_ENFORCE:-}" != "true" ]; then
              echo "::warning title=Web toolchain advisories::${high} HIGH/CRITICAL finding(s) in package-lock.json. Not blocking: this PR changes no npm dependency files."
            fi
          fi

  gosec:
    name: "Security: Gosec SAST"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Gosec
        uses: securego/gosec@5eb1d104ef85ff2c905c877eb600e8c1dee33a22  # v2.30.0 image
        with:
          # -no-fail keeps gosec itself from deciding the job's outcome. gosec
          # has no native severity cutoff (unlike severity-cutoff: high on the
          # Grype steps above) — left to itself it fails on ANY finding at any
          # severity, including LOW heuristic rules like G104 (unhandled
          # errors), historically this repo's most common gosec finding by far.
          # The "Gate on gosec HIGH/MEDIUM findings" step below is the real
          # gate and decides pass/fail explicitly. Findings reach the Security
          # tab via the upload below either way.
          args: -no-fail -fmt sarif -out gosec-results.sarif ./...

      - name: Upload Gosec SARIF
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: gosec-results.sarif
          category: gosec

      - name: Gate on gosec HIGH/MEDIUM findings
        # Ordered after the SARIF upload so findings still reach the Security
        # tab on the runs where this step fails the job. gosec maps its own LOW
        # severity to SARIF level "warning" and MEDIUM/HIGH to "error"
        # (getSarifLevel in report/sarif/formatter.go), so filtering on
        # level == "error" gates MEDIUM+HIGH without treating LOW-severity
        # noise as blocking. Fails closed: a missing or unparseable SARIF is a
        # failure, not a silent pass, because "Security: Gosec SAST" is a
        # required context and a no-op gate is worse than no gate.
        if: always()
        run: |
          set -euo pipefail
          sarif_file="gosec-results.sarif"

          if [ ! -s "${sarif_file}" ]; then
            echo "::error::${sarif_file} is missing or empty; failing closed rather than passing the gosec gate silently."
            exit 1
          fi

          if ! jq -e '
            .version == "2.1.0"
            and (.runs | type == "array" and length == 1)
            and .runs[0].tool.driver.name == "gosec"
            and (.runs[0].results | type == "array")
          ' "${sarif_file}" >/dev/null 2>&1; then
            echo "::error::${sarif_file} has no valid gosec SARIF run/results; failing closed."
            exit 1
          fi

          gating_count="$(jq '[.runs[0].results[]? | select(.level == "error")] | length' "${sarif_file}")"
          echo "gosec MEDIUM/HIGH findings (SARIF level=error): ${gating_count}"

          if [ "${gating_count}" -gt 0 ]; then
            jq -r '.runs[0].results[]? | select(.level == "error")
              | "  " + .ruleId + " " + (.locations[0].physicalLocation.artifactLocation.uri // "?")
                + ":" + ((.locations[0].physicalLocation.region.startLine // 0) | tostring)' "${sarif_file}"
            echo "::error::gosec found ${gating_count} MEDIUM/HIGH issue(s). See the Security tab (category: gosec), or suppress a false positive with a justified #nosec comment."
            exit 1
          fi

  resolve-latest-release:
    name: "Security: Resolve Latest Published Release"
    # grype-image above only ever scans an image `docker build` produces from
    # the current branch: one platform, a digest nobody pulls, and base-image
    # layers that are not the ones users are running. release.yml's
    # grype-published-image job does scan the real multi-arch manifest, but it
    # is gated on `push: tags: v*`, so it fires exactly once, at tag-cut time.
    # Between releases nothing re-pulls the published image, so a CVE disclosed
    # against it after the cut stays invisible until the next release ships.
    # This job resolves the currently-published tag so the scan below can
    # re-check it every Monday whether or not a release went out that week.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.latest_release.outputs.version }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          # Narrower than the sibling jobs on purpose: this one only calls the
          # REST API through gh. No checkout, no scanner, no registry.
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Resolve latest published, non-prerelease tag
        id: latest_release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # --exclude-pre-releases is load-bearing rather than tidiness: the
          # house flow cuts -rc.N tags on the dev branch, and a release
          # candidate is not what users have installed. --exclude-drafts for
          # the same reason from the other direction — a draft release has no
          # published GHCR image behind it at all.
          tag="$(gh release list --repo "${REPOSITORY}" --exclude-drafts --exclude-pre-releases \
            --limit 1 --json tagName --jq '.[0].tagName')"
          if [ -z "${tag}" ]; then
            # Skip, do not fail. "This repo has never cut a GA release" is a
            # true fact about the repo, not a security regression, and a
            # weekly red X that means that is how a lane gets ignored. The
            # scan job below is gated on a non-empty version.
            echo "::notice::No published non-prerelease release in ${REPOSITORY}; nothing to re-scan."
            {
              echo "### Grype Published Release Re-scan"
              echo "- Skipped: ${REPOSITORY} has no published, non-prerelease release yet."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Latest published release: ${tag}"
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

  grype-published-release:
    name: "Security: Grype Published Release Image (${{ matrix.platform }})"
    needs: resolve-latest-release
    # An empty version means resolve-latest-release found no GA release and
    # already said so in the step summary. A skipped `needs` job skips this one
    # too, so the pull_request case is covered without repeating the event
    # check that gates the job above.
    if: needs.resolve-latest-release.outputs.version != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # Every supported release platform uses the same HIGH/CRITICAL gate.
        include:
          - platform: linux/amd64
            slug: linux-amd64
          - platform: linux/arm64
            slug: linux-arm64
          - platform: linux/arm/v7
            slug: linux-armv7
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          # ghcr.io is the GHCR manifest API and pkg-containers is its blob
          # storage — the same pair release.yml's grype-published-image job
          # allows for the same pull. get.anchore.io, github.com and
          # release-assets.githubusercontent.com are how anchore/scan-action
          # installs grype; grype.anchore.io and storage.googleapis.com are its
          # vulnerability DB. Both sets are copied from grype-image above,
          # which runs the same action. No cosign/sigstore hosts here: unlike
          # release.yml, this job installs grype through the action instead of
          # verifying pinned release assets itself.
          allowed-endpoints: >
            api.github.com:443
            get.anchore.io:443
            ghcr.io:443
            github.com:443
            grype.anchore.io:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Checkout
        # Only for .grype.yaml. The image under scan comes from the registry,
        # never from this working tree — that distinction is the whole point
        # of the job.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to GHCR
        # The package is public today, so the pull would work anonymously.
        # Same reasoning release.yml records: this job has to keep working if
        # the repo goes private, which is exactly when a private package would
        # break the anonymous path. Grype reads these credentials out of the
        # Docker config this action writes.
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550  # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve platform-specific digest
        id: platform_digest
        env:
          IMAGE_TAG: ${{ needs.resolve-latest-release.outputs.version }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          # GHCR rejects mixed-case paths and github.repository preserves the
          # org's real case (CodesWhat/portwing), so lowercase it rather than
          # hardcoding the string release.yml hardcodes.
          repo_lower="$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          image_ref="ghcr.io/${repo_lower}:${IMAGE_TAG}"
          IFS=/ read -r os arch variant <<<"${PLATFORM}"

          manifest="$(docker buildx imagetools inspect "${image_ref}" --raw)"
          # Resolving the per-platform CHILD digest, not the index digest, is
          # what lets this work without a --platform flag — which matters
          # because anchore/scan-action exposes no input for one. A child
          # digest names a single-platform manifest, so there is nothing left
          # for the scanner to select and no way for the arm64 leg to silently
          # scan the runner's native amd64 image instead.
          #
          # Collapsed to exactly one match: zero or two-plus both produce an
          # empty string and fail below, rather than scanning the first of
          # several or handing grype a two-line digest. The `unknown/unknown`
          # entries in the index (attestation manifests) match neither.
          digest="$(printf '%s' "${manifest}" | jq -r --arg os "${os}" --arg arch "${arch}" --arg variant "${variant}" '
            [.manifests[]? | select(.platform.os == $os and .platform.architecture == $arch and ($variant == "" or (.platform.variant // "") == $variant)) | .digest]
            | unique
            | if length == 1 then .[0] else "" end
          ')"
          if [ -z "${digest}" ] || [ "${digest}" = "null" ]; then
            echo "::error::Expected exactly one ${PLATFORM} manifest in ${image_ref}; refusing to scan an ambiguous or missing platform."
            exit 1
          fi
          echo "Resolved ${PLATFORM} to ${digest}"
          # `registry:` keeps the pull off the Docker daemon, which would
          # otherwise have to pull a foreign-architecture image on the arm64
          # leg. release.yml's published-image job uses the same scheme.
          echo "ref=registry:ghcr.io/${repo_lower}@${digest}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${repo_lower}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Run Grype vulnerability scanner
        # Same policy as grype-image above — HIGH cutoff, fail the build, and
        # the repo's own .grype.yaml so a finding already adjudicated there
        # does not re-fire here. A red run on this job means the image users
        # are currently pulling has an unadjudicated HIGH: either cut a
        # release, or add a justified, version-scoped ignore.
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        id: grype
        with:
          image: ${{ steps.platform_digest.outputs.ref }}
          severity-cutoff: high
          fail-build: true
          output-format: sarif
          config: .grype.yaml

      - name: Upload Grype SARIF to code scanning
        # Code scanning uploads require GHAS, not available on free private
        # repos. Only the reporting is conditional; the gate above always runs.
        # The empty-sarif guard is not in the sibling jobs because they cannot
        # hit it: this job can fail before grype ever runs (digest resolution),
        # and uploading a path that was never written just adds a second,
        # misleading red step on top of the real one.
        if: always() && github.event.repository.visibility == 'public' && steps.grype.outputs.sarif != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-published-release-${{ matrix.slug }}

      - name: Summarize
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          IMAGE_REF: ${{ steps.platform_digest.outputs.image }}
          VERSION: ${{ needs.resolve-latest-release.outputs.version }}
        run: |
          {
            echo "### Grype Published Release Image (${PLATFORM})"
            echo "- Re-scanned the published GHCR manifest for v${VERSION} at \`${IMAGE_REF}\`"
            echo "- Catches CVEs disclosed against the shipped image since the release was cut"
            echo "- Suppressions from .grype.yaml; fails on HIGH and above"
          } >> "$GITHUB_STEP_SUMMARY"

  # NOTE: No testssl job is configured here. Standard Mode supports direct TLS
  # through TLS_CERT/TLS_KEY, while the public site uses Vercel TLS. Add a runtime
  # TLS scan when CI has a stable agent endpoint to test.
