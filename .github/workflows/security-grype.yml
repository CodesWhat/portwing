name: "🛡️ Security: Grype & Govulncheck"
run-name: >-
  ${{
    github.event_name == 'schedule' && '🛡️ Security: Grype & Govulncheck — Weekly run' ||
    github.event_name == 'pull_request' && format('🛡️ Security: Grype & Govulncheck — PR #{0}', github.event.pull_request.number) ||
    format('🛡️ Security: Grype & Govulncheck — Manual by {0}', github.actor)
  }}

on:
  workflow_dispatch:
  pull_request:
    branches: [main, 'dev/*']
    # Dependency / source / build changes are what move the security
    # surface — scope PR runs to those so doc-only PRs stay fast.
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
      - 'package-lock.json'
      - '**/package.json'
      - 'Dockerfile*'
      - '.grype.yaml'
      - '.github/workflows/security-grype.yml'
      - 'scripts/verify-scanner-exclusions.sh'
  schedule:
    - cron: '15 7 * * 1'  # Weekly on Monday at 07:15 UTC

permissions:
  contents: read

env:
  GOVULNCHECK_VERSION: v1.2.0

concurrency:
  group: security-grype-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  govulncheck:
    name: "🔍 Security: Govulncheck"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            sum.golang.org:443
            vuln.go.dev:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          # Reads the exact `toolchain` directive from go.mod (setup-go honors
          # toolchain over the `go` line), so the scan runs on the same pinned,
          # patched toolchain the binary is built with — one source of truth.
          go-version-file: go.mod

      - name: Verify scoped scanner exclusions are not imported
        run: ./scripts/verify-scanner-exclusions.sh

      - name: Install govulncheck
        run: go install "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}"

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Govulncheck"
            echo "- Reachability-based scan of Go dependencies (call-graph aware)"
            echo "- Tool version: ${GOVULNCHECK_VERSION}"
            echo "- Database: Go Vulnerability Database (vuln.go.dev)"
          } >> "$GITHUB_STEP_SUMMARY"

  grype-image:
    name: "🐳 Security: Grype Container Scan"
    # Image build is the heavy step; keep it on scheduled/manual runs.
    # PRs get fast, accurate dependency coverage from grype-deps +
    # govulncheck without paying for a Docker build on every push.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          # 9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com is the R2
          # bucket Chainguard currently serves cgr.dev/chainguard/wolfi-base blob
          # layers from. Pinned to the exact host rather than a *.r2.cloudflarestorage.com
          # wildcard; if the bucket hash rotates, widen to the wildcard instead.
          allowed-endpoints: >
            9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com:443
            api.github.com:443
            auth.docker.io:443
            cgr.dev:443
            dl-cdn.alpinelinux.org:443
            get.anchore.io:443
            github.com:443
            grype.anchore.io:443
            packages.wolfi.dev:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Build image for scanning
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: portwing:grype-scan
          # Keep the vulnerability scan honest: cached apk-install layers can
          # preserve stale distro packages after Wolfi publishes fixes.
          no-cache: true

      - name: Verify scoped scanner exclusions are not linked
        run: |
          container_id="$(docker create portwing:grype-scan)"
          trap 'docker rm -f "${container_id}" >/dev/null' EXIT
          docker cp "${container_id}:/usr/bin/portwing" /tmp/portwing
          docker cp "${container_id}:/usr/bin/docker-compose" /tmp/docker-compose
          ./scripts/verify-scanner-exclusions.sh /tmp/portwing /tmp/docker-compose

      - name: Run Grype vulnerability scanner
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        id: grype
        with:
          image: portwing:grype-scan
          severity-cutoff: high
          fail-build: true
          output-format: sarif
          config: .grype.yaml

      - name: Upload Grype SARIF to code scanning
        # Code scanning uploads require GHAS, not available on free private repos.
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype-image

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Grype Container Scan"
            echo "- Scanned the built image (binary build-info → real shipped deps) for HIGH/CRITICAL CVEs"
            echo "- Base image: Wolfi (Chainguard) packages on FROM scratch"
          } >> "$GITHUB_STEP_SUMMARY"

  grype-deps:
    name: "📦 Security: Grype Dependency Scan (Go + npm)"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            get.anchore.io:443
            github.com:443
            grype.anchore.io:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Grype across the repository (Go modules + npm lockfiles)
        # Scanning the repo root catalogs go.mod/go.sum and package-lock.json,
        # so a single pass covers both ecosystems. Grype matches the
        # lockfile-resolved versions (not the full module requirement graph),
        # so it does not emit the phantom-dependency findings a manifest-graph
        # SCA reports for modules the binary never links in.
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2  # v7.4.0
        id: grype-deps
        with:
          path: .
          severity-cutoff: high
          fail-build: true
          output-format: sarif
          config: .grype.yaml

      - name: Upload Grype dependency SARIF
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: ${{ steps.grype-deps.outputs.sarif }}
          category: grype-deps

      - name: Summarize
        if: always()
        run: |
          {
            echo "### Grype Dependency Scan (Go + npm)"
            echo "- Scanned Go modules and npm lockfiles across the repo for HIGH/CRITICAL CVEs"
            echo "- Matches lockfile-resolved versions (no module-graph false positives)"
          } >> "$GITHUB_STEP_SUMMARY"

  gosec:
    name: "🔐 Security: Gosec SAST"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            proxy.golang.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Gosec
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3  # v2.28.0
        with:
          # Report-only: gosec is heuristic (e.g. G115 int->uint conversions in
          # the benchmark helpers) and feeds findings to the Security tab via the
          # SARIF upload below. Build gating is handled by CodeQL (ruleset-enforced),
          # Grype, and govulncheck, so -no-fail keeps gosec from failing the run
          # on advisory-level findings while still surfacing them for triage.
          args: -no-fail -fmt sarif -out gosec-results.sarif ./...

      - name: Upload Gosec SARIF
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: gosec-results.sarif
          category: gosec

  # NOTE: testssl job omitted. Portwing does not operate a TLS listener of its own
  # (TLS is handled by a reverse proxy in front). Re-add if Portwing gains direct
  # TLS termination.
