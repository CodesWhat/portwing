name: "Quality: ClusterFuzzLite (code change)"
run-name: >-
  ${{
    github.event_name == 'pull_request' && format('ClusterFuzzLite — code change on PR #{0}', github.event.pull_request.number) ||
    format('ClusterFuzzLite — code change, manual by {0}', github.actor)
  }}

# Tier 4 of the fuzz strategy, and the only tier that is not `go test -fuzz`.
# The other four run the Go native engine:
#
#   tier 0  lefthook pre-push          5s per fuzzer
#   tier 1  ci-verify.yml go-fuzz      60s per fuzzer, every push/PR
#   tier 2  quality-fuzz-nightly.yml   5m per fuzzer, daily 09:30 UTC
#   tier 3  quality-fuzz-monthly.yml   1h per fuzzer, day 1 at 02:30 UTC
#
# This one builds the SAME ten `func Fuzz*(f *testing.F)` targets against
# libFuzzer and AddressSanitizer through OSS-Fuzz's base-builder-go, and runs
# them against a corpus committed to a branch. Tiers 2 and 3 also persist their
# corpus, but through the Actions cache, where an entry is evicted after seven
# days without a hit; a branch does not expire. See .clusterfuzzlite/build.sh
# for what a target may depend on here, which is narrower than `go test`.
#
# What this tier adds that the Go engine cannot: ASan catches memory errors
# reached through cgo and the runtime that Go's own fuzzer does not model, and
# the corpus persists on a branch instead of being thrown away at the end of
# every run.
#
# --- Corpus persistence ------------------------------------------------------
#
# storage-repo points at THIS repository on the orphan branch
# `clusterfuzzlite-corpus`, authenticated with ${{ github.token }}. No new
# secret, no new repository.
#
# This works because ClusterFuzzLite's git filestore
# (oss-fuzz infra/cifuzz/filestore/git/__init__.py) runs a plain
# `git clone <storage-repo>` and never rewrites the URL, so the URL itself can
# carry the credential; and because GITHUB_TOKEN can push to an unprotected
# branch of its OWN repository. The upstream docs' insistence on a personal
# access token is scoped to a SEPARATE storage repo ("the default GitHub auth
# token is not able to write to other repositories"), which is not what this is.
#
# This job still gets `contents: read`, because code-change mode never writes:
# in infra/cifuzz/run_fuzzers.py only BatchFuzzTargetRunner and
# PruneTargetRunner call upload_corpus, and code-change mode maps to
# CiFuzzTargetRunner. It clones the corpus branch, fuzzes from it, and pushes
# nothing. The `contents: write` grant lives on the two scheduled lanes,
# quality-fuzz-cflite-batch.yml and quality-fuzz-cflite-prune.yml, and the
# first of those carries the note on creating the branch.
#
# The trigger is `pull_request`, not `pull_request_target`, so a fork's token is
# read-only no matter what this file asks for. That is deliberate: a fork PR can
# read the public corpus branch and fuzz, and can do nothing else.
#
# --- Runtime image pins ------------------------------------------------------
#
# Google's action metadata selects floating runtime images even when the action
# is pinned by commit. The local action definitions pin those runtime images by
# digest and these steps supply the same entrypoint environment explicitly. Our own builder is also
# pinned in .clusterfuzzlite/Dockerfile. This does not pin every transitive input:
# enabling an upstream alternate base OS needs a separate runtime-image review.
#
# --- If the egress allow-list is wrong ---------------------------------------
#
# harden-runner blocks on DNS, so a missing host shows up as an opaque network
# failure inside a container, not as "host X was blocked". The run's
# StepSecurity insights link lists what was actually attempted; add the host
# there rather than guessing. storage.googleapis.com is for the gcr.io blob
# layers, and proxy.golang.org/sum.golang.org carry both the modules and the
# go1.27.2 toolchain that base-builder-go's Go 1.25.0 downloads on first use.
#
# The three artifact hosts (*.actions.githubusercontent.com,
# results-receiver.actions.githubusercontent.com, *.blob.core.windows.net) are
# what @actions/artifact talks to, and they are needed on EVERY lane here, not
# just the two that write the corpus. Setting storage-repo does not take the
# GitHub Actions filestore out of the picture: filestore_utils.get_filestore
# builds a GitFilestore WRAPPING a GithubActionsFilestore, and GitFilestore's
# upload_crashes delegates straight back to it. So the corpus goes to the
# branch, but a crash reproducer goes out as a workflow artifact. Without these
# hosts the fuzzing still runs and the job can still go red, and the one thing
# needed to reproduce the finding is the thing that silently fails to upload.
# Same three entries as quality-fuzz-nightly.yml and quality-fuzz-monthly.yml.

on:
  pull_request:
    branches: [main, "dev/**"]
    # Scoped to what can change a fuzz result. A docs- or website-only PR gets
    # nothing out of a 20-minute OSS-Fuzz build, and this lane is not a required
    # check, so a skip here blocks nothing.
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - .clusterfuzzlite/**
      - .github/actions/cflite-*/**
      - .github/workflows/quality-fuzz-cflite-pr.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-fuzz-cflite-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-change-fuzz:
    name: "ClusterFuzzLite (code change)"
    runs-on: ubuntu-24.04
    # Pulling base-builder-go, downloading the go1.27.2 toolchain, building ten
    # libFuzzer targets, and 300 seconds of fuzzing. 30 minutes is roughly
    # double the expected wall time.
    timeout-minutes: 30

    permissions:
      contents: read
      # run_fuzzers lists this repository's workflow artifacts when a crash is
      # found, to decide whether the crash is novel. Read-only, and only
      # exercised on the runs that find something.
      actions: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            gcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      # Repository-owned runtime metadata is pinned independently by commit,
      # without a source checkout or persisted checkout credentials. The runtime
      # independently clones the source merge ref before building targets.
      - name: Build fuzzers
        id: build
        uses: CodesWhat/portwing/.github/actions/cflite-build@44ff5baf85bc2b2635937e9aecd48dc1bafab590  # pinned runtime metadata
        env:
          LANGUAGE: go
          SANITIZER: address
          GITHUB_TOKEN: ${{ github.token }}
          # Without this, build_fuzzers drops every target it cannot prove the
          # diff reaches, and it proves that from coverage reports. We run no
          # coverage lane, so there are none, and the honest configuration is to
          # run all ten rather than to depend on how the upstream code happens to
          # fail when the report is missing.
          KEEP_UNAFFECTED_FUZZ_TARGETS: "true"
          LOW_DISK_SPACE: "True"
          CFL_PLATFORM: github
          DRY_RUN: "false"
          ALLOWED_BROKEN_TARGETS_PERCENTAGE: ""
          BAD_BUILD_CHECK: "true"
          UPLOAD_BUILD: "false"
          PROJECT_SRC_PATH: ""
          GIT_STORE_REPO: ""
          GIT_STORE_BRANCH: ""
          GIT_STORE_BRANCH_COVERAGE: ""

      - name: Run fuzzers
        id: run
        uses: CodesWhat/portwing/.github/actions/cflite-run@44ff5baf85bc2b2635937e9aecd48dc1bafab590  # pinned runtime metadata
        env:
          LANGUAGE: go
          GITHUB_TOKEN: ${{ github.token }}
          # Total across all ten targets, not per target: run_fuzzers.py splits
          # the budget with fuzz_seconds // len(targets), so this is 30s each.
          FUZZ_SECONDS: "300"
          MODE: code-change
          SANITIZER: address
          GIT_STORE_REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          GIT_STORE_BRANCH: clusterfuzzlite-corpus
          # Pinned to the corpus branch rather than left at its `gh-pages`
          # default. Nothing here generates coverage, but a default of gh-pages
          # means any future coverage mode would create a GitHub Pages branch in
          # this repository as a side effect.
          GIT_STORE_BRANCH_COVERAGE: clusterfuzzlite-corpus
          LOW_DISK_SPACE: "True"
          CFL_PLATFORM: github
          DRY_RUN: "false"
          REPORT_UNREPRODUCIBLE_CRASHES: "False"
          OUTPUT_SARIF: "false"
          MINIMIZE_CRASHES: "False"
          PARALLEL_FUZZING: "false"
