name: "Quality: ClusterFuzzLite (prune)"
run-name: >-
  ${{
    github.event_name == 'schedule' && 'ClusterFuzzLite — weekly corpus prune' ||
    format('ClusterFuzzLite — prune, manual by {0}', github.actor)
  }}

# The pruning half of tier 4. Batch fuzzing accumulates inputs on the corpus
# branch every week and never removes any; prune replaces each target's corpus
# with the smallest set that keeps the same coverage. Without it the corpus only
# grows, and the time batch spends replaying it eats the hour it is supposed to
# spend finding things. The upstream docs put this plainly: if batch fuzzing is
# running, corpus pruning has to run too.
#
# Full rationale for the tier, the corpus-persistence design, and what about
# ClusterFuzzLite cannot be pinned: quality-fuzz-cflite-pr.yml. Why this is its
# own file rather than a second job next to batch: quality-fuzz-cflite-batch.yml.
#
# Wednesday, four days after Saturday's batch run, so it always minimizes a
# corpus that has just grown rather than one that is about to.

on:
  schedule:
    - cron: '30 10 * * 3'  # Wednesdays 10:30 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # The same literal group as quality-fuzz-cflite-batch.yml, which is what keeps
  # the two corpus writers off the branch at the same time. Concurrency groups
  # are repository-scoped strings, so two workflows naming the same one
  # serialize against each other. Deriving it from ${{ github.workflow }} would
  # quietly give each file its own group.
  group: quality-fuzz-cflite-corpus
  cancel-in-progress: false

jobs:
  prune-corpus:
    name: "ClusterFuzzLite (prune)"
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    permissions:
      # PruneTargetRunner uploads with replace=True, which deletes the target's
      # directory on the branch and writes the minimized set in its place. Same
      # single-branch write as batch, and nothing else.
      contents: write
      actions: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            api.github.com:443
            gcr.io:443
            github.com:443
            objects.githubusercontent.com:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443

      - name: Build fuzzers
        id: build
        uses: docker://gcr.io/oss-fuzz-base/clusterfuzzlite-build-fuzzers:v1@sha256:7321896d954e0a91af88b35527a5429fcb9990acb0e72782392bcd49d34c526c  # v1
        env:
          LANGUAGE: go
          SANITIZER: address
          GITHUB_TOKEN: ${{ github.token }}
          LOW_DISK_SPACE: "True"
          CFL_PLATFORM: github
          DRY_RUN: "false"
          ALLOWED_BROKEN_TARGETS_PERCENTAGE: ""
          BAD_BUILD_CHECK: "true"
          UPLOAD_BUILD: "false"
          PROJECT_SRC_PATH: ""
          GIT_STORE_REPO: ""
          GIT_STORE_BRANCH: ""
          GIT_STORE_BRANCH_COVERAGE: ""
          KEEP_UNAFFECTED_FUZZ_TARGETS: "false"

      - name: Run fuzzers
        id: run
        uses: docker://gcr.io/oss-fuzz-base/clusterfuzzlite-run-fuzzers:v1@sha256:32af8937086deaad780a5a61619a0d7fb6a43cf39daa717d5fcbb4da82a29cc3  # v1
        env:
          LANGUAGE: go
          GITHUB_TOKEN: ${{ github.token }}
          FUZZ_SECONDS: "600"
          MODE: prune
          SANITIZER: address
          GIT_STORE_REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
          GIT_STORE_BRANCH: clusterfuzzlite-corpus
          GIT_STORE_BRANCH_COVERAGE: clusterfuzzlite-corpus
          LOW_DISK_SPACE: "True"
          CFL_PLATFORM: github
          DRY_RUN: "false"
          REPORT_UNREPRODUCIBLE_CRASHES: "False"
          OUTPUT_SARIF: "false"
          MINIMIZE_CRASHES: "False"
          PARALLEL_FUZZING: "false"
