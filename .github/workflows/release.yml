name: "Release"

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Kept equal to the grype that anchore/scan-action@v7.4.0 installs in
  # security-grype.yml, so the release scan and the PR/scheduled scans cannot
  # disagree about the same image. Bump both together.
  GRYPE_VERSION: "0.110.0"

jobs:
  verify-release-source:
    name: "Verify Release Source"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and verify release target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
          if ! git merge-base --is-ancestor "${target_sha}" origin/main; then
            echo "::error::Release target ${target_sha} is not on origin/main."
            exit 1
          fi
          echo "sha=${target_sha}" >> "$GITHUB_OUTPUT"

      - name: Verify successful CI on release target
        uses: ./.github/actions/verify-ci-success
        with:
          workflow-file: ci-verify.yml
          target-sha: ${{ steps.target.outputs.sha }}
          github-token: ${{ github.token }}

  release:
    name: "GoReleaser + Cosign"
    needs: verify-release-source
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: Production
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            9236a389bd48b984df91adc1bc924620.r2.cloudflarestorage.com:443
            api.github.com:443
            auth.docker.io:443
            cgr.dev:443
            dl-cdn.alpinelinux.org:443
            dl.google.com:443
            fulcio.sigstore.dev:443
            get.anchore.io:443
            ghcr.io:443
            github.com:443
            go.dev:443
            goreleaser.com:443
            packages.wolfi.dev:443
            pkg-containers.githubusercontent.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            raw.githubusercontent.com:443
            registry-1.docker.io:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            timestamp.sigstore.dev:443
            toolbox-data.anchore.io:443
            tuf-repo-cdn.sigstore.dev:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          # Release builds are hermetic: no restored module/build cache can
          # influence published artifacts (zizmor cache-poisoning). Modules
          # are fetched fresh from the proxy on every release.
          cache: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94  # v7.2.3
        with:
          version: "v2.16.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - name: Resolve container manifest digest
        id: manifest-digest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          DIGEST=$(docker buildx imagetools inspect "ghcr.io/codeswhat/portwing:${VERSION}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"' || true)
          if [ -z "$DIGEST" ]; then
            echo "No manifest digest resolved, skipping image attestation."
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Attests every artifact listed in checksums.txt: archives, packages, and
      # per-archive SBOMs. Verify any one with:
      # gh attestation verify <asset> --repo CodesWhat/portwing
      # Gated on public visibility: GitHub artifact attestation is not available
      # for private repos on this org's plan (cosign blob signatures in
      # checksums.txt.bundle still authenticates those assets either way).
      - name: Attest checksummed release assets
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-checksums: dist/checksums.txt
          # We don't consume GitHub's artifact-metadata catalog; the Sigstore
          # attestation (Rekor + gh attestation verify) is the source of truth.
          create-storage-record: false

      # Container images (per-arch AND manifest lists) are cosign keyless-signed
      # by GoReleaser docker_signs; the version-tag manifest additionally gets
      # GitHub build provenance here when the repo is public.
      - name: Attest container manifest
        if: github.event.repository.visibility == 'public' && steps.manifest-digest.outputs.digest != ''
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ghcr.io/codeswhat/portwing
          subject-digest: ${{ steps.manifest-digest.outputs.digest }}
          push-to-registry: true
          # OCI digest subjects have no file artifacts to catalog, so the
          # artifact-metadata storage record always errors "no artifacts found".
          # The attestation is pushed to the registry and gh-verifiable regardless.
          create-storage-record: false

  grype-published-image:
    name: "Security: Grype Published Image"
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
      security-events: write
    # Deliberately NOT gated on repository visibility. verify-published carries
    # that gate because Sigstore public-ledger verification is impossible on a
    # private repo; vulnerability scanning has no such dependency. Only the
    # SARIF upload below needs public visibility, so gating the whole job would
    # silently switch OFF the vulnerability gate the moment the repo went
    # private, which is the failure this job exists to prevent.
    strategy:
      fail-fast: false
      matrix:
        # All three published platforms. security-grype.yml's grype-image job
        # scans an image it builds itself from the root Dockerfile, which is a
        # Wolfi-only from-source build resolved to the runner's own
        # architecture. That is not what ships. This job scans the actual
        # pushed manifest, per platform.
        #
        # `gate: high` fails the release on HIGH and above. `gate: none`
        # reports to the Security tab without failing.
        #
        # arm/v7 is report-only, and that is a stated exception rather than a
        # default. Wolfi publishes no armv7 repo, so Dockerfile.release builds
        # that leg from Alpine using its prebuilt docker-cli/docker-cli-compose,
        # which are themselves compiled with Go 1.26.3. Every stdlib advisory
        # they carry is fixed in Go 1.26.6, and portwing's own go.mod already
        # pins toolchain go1.26.6 — the vulnerable toolchain is Alpine's, not
        # this repo's, and no Alpine branch ships a go>=1.26.6-built package
        # yet (edge is on 1.26.5, one patch short). portwing's own binary
        # carries zero findings on all three platforms.
        #
        # Suppressing those to force the leg green would hide real, fixable
        # CVEs, so the gap is left visible instead. Flip armv7 to `high` once
        # Alpine ships those packages. Do NOT quietly drop the leg from this
        # matrix; the contract test asserts linux/arm/v7 by name.
        include:
          - platform: linux/amd64
            gate: high
          - platform: linux/arm64
            gate: high
          - platform: linux/arm/v7
            gate: none
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          # ghcr.io + pkg-containers from verify-published (same image pull);
          # grype.anchore.io/storage.googleapis.com for the vulnerability DB,
          # same as the security-grype.yml jobs; github.com +
          # release-assets.githubusercontent.com for the pinned grype release
          # assets; tuf-repo* for the cosign trust root. get.anchore.io is
          # absent on purpose — the install step no longer pipes that script
          # to a shell.
          #
          # rekor.sigstore.dev is REQUIRED, not optional. `cosign verify-blob`
          # with a detached --certificate/--signature pair (rather than an
          # offline --bundle) looks the entry up in the transparency log before
          # it will report success. Verified by pointing --rekor-url at a dead
          # host: cosign fails with `searching log query: Post .../api/v1/log/
          # entries/retrieve`. Without this endpoint the install step dies under
          # egress-policy: block and every leg stops before scanning anything.
          # The sibling jobs in this file already allow it; this one was the
          # odd one out.
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
            grype.anchore.io:443
            pkg-containers.githubusercontent.com:443
            raw.githubusercontent.com:443
            rekor.sigstore.dev:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Login to GHCR
        # The image is public today, so both the digest resolution and the scan
        # below would work anonymously. This job exists to keep scanning if the
        # repo goes private, and a private repo means a private package, so the
        # anonymous path would break exactly when the job matters most. Grype
        # picks these credentials up from the Docker config the action writes.
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Install Grype
        # Version-pinned to match what anchore/scan-action@v7.4.0 installs in
        # security-grype.yml, so both scanners agree. Bump this and the
        # scan-action pin together.
        #
        # Deliberately NOT `curl https://get.anchore.io/grype | sh`. That
        # script's own `-v` flag verifies the release archive, but the script
        # itself is fetched over a mutable URL and executed before any of that
        # verification runs — the check happens inside code an attacker would
        # already control. Fetching the pinned assets and verifying them here
        # puts the signature check ahead of anything executing.
        #
        # The signer identity is exact, not a regexp: read off grype v0.110.0's
        # own certificate SAN, and confirmed to reject a near-miss identity.
        # Re-read it if a bump ever fails this step rather than loosening it.
        run: |
          set -euo pipefail
          base="https://github.com/anchore/grype/releases/download/v${GRYPE_VERSION}"
          archive="grype_${GRYPE_VERSION}_linux_amd64.tar.gz"
          sums="grype_${GRYPE_VERSION}_checksums.txt"

          workdir="$(mktemp -d)"
          cd "${workdir}"
          curl -fsSLO "${base}/${archive}"
          curl -fsSLO "${base}/${sums}"
          curl -fsSLO "${base}/${sums}.pem"
          curl -fsSLO "${base}/${sums}.sig"

          cosign verify-blob "${sums}" \
            --certificate "${sums}.pem" \
            --signature "${sums}.sig" \
            --certificate-identity "https://github.com/anchore/grype/.github/workflows/release.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com"

          # Reduced to the one line for our archive rather than passing
          # `--ignore-missing`, which exits 0 when the archive is absent from
          # the manifest entirely. sha256sum fails on an empty input file, so
          # a manifest that does not name this archive fails closed.
          grep -F " ${archive}" "${sums}" > archive.sha256
          sha256sum -c archive.sha256

          tar -xzf "${archive}" grype
          # sudo, because /usr/local/bin is root-owned on GitHub-hosted
          # runners. A period of runner-user ownership made the unprivileged
          # write appear to work (actions/runner-images#14477) and it is being
          # restored to root, so the unprivileged form would start failing
          # under us. Passwordless sudo is documented on these runners.
          sudo install -m 0755 grype /usr/local/bin/grype
          cd - >/dev/null
          rm -rf "${workdir}"
          grype version

      - name: Resolve container manifest digest
        id: manifest-digest
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DIGEST="$(docker buildx imagetools inspect "ghcr.io/codeswhat/portwing:${VERSION}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          if [ -z "${DIGEST}" ]; then
            echo "::error::Could not resolve a manifest digest for ghcr.io/codeswhat/portwing:${VERSION}; refusing to scan an unpinned tag."
            exit 1
          fi
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Run Grype against the published image
        id: grype
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          DIGEST: ${{ steps.manifest-digest.outputs.digest }}
          GATE: ${{ matrix.gate }}
        run: |
          set -euo pipefail
          slug="$(printf '%s' "${PLATFORM}" | tr '/' '-')"
          echo "sarif=grype-published-${slug}.sarif" >> "$GITHUB_OUTPUT"
          echo "category=grype-published-${slug}" >> "$GITHUB_OUTPUT"

          # Fail closed on a matrix entry that forgot its gate, rather than
          # defaulting to report-only and silently un-gating a leg.
          case "${GATE}" in
            high) fail_on=(--fail-on high) ;;
            none) fail_on=() ;;
            *)
              echo "::error::Unknown gate '${GATE}' for ${PLATFORM}; expected 'high' or 'none'."
              exit 1
              ;;
          esac

          # `registry:` reads the platform-specific manifest straight from the
          # registry API. Neither anchore/scan-action nor `docker pull` is used
          # here: the action exposes no platform input, so it silently resolves
          # only the runner's native arch out of a multi-arch manifest and
          # leaves the other legs unscanned.
          grype "registry:ghcr.io/codeswhat/portwing@${DIGEST}" \
            --platform "${PLATFORM}" \
            --config .grype.yaml \
            ${fail_on[@]+"${fail_on[@]}"} \
            -o sarif --file "grype-published-${slug}.sarif"

          if [ "${GATE}" = "none" ]; then
            echo "::warning::${PLATFORM} is scanned report-only; findings do not fail the release. See RELEASING.md for why and when this flips to gating."
          fi

      - name: Upload Grype SARIF to code scanning
        # Code scanning uploads require GHAS, not available on free private
        # repos. Only the reporting is conditional; the gate above always runs.
        if: always() && github.event.repository.visibility == 'public'
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: ${{ steps.grype.outputs.category }}

      - name: Summarize
        if: always()
        env:
          PLATFORM: ${{ matrix.platform }}
          DIGEST: ${{ steps.manifest-digest.outputs.digest }}
          GATE: ${{ matrix.gate }}
        run: |
          if [ "${GATE}" = "none" ]; then
            gate_line="- Gate: **report-only** (findings do not fail the release; see RELEASING.md)"
          else
            gate_line="- Gate: fails on ${GATE} and above"
          fi
          {
            echo "### Grype Published Image (${PLATFORM})"
            echo "- Scanned the pushed manifest at ${DIGEST}"
            echo "- Suppressions from .grype.yaml"
            echo "${gate_line}"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    name: "Verify Published"
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    # Gate: Sigstore public-ledger attestation verification requires the repo to
    # be public (so the OIDC token was issued against a public-visible identity).
    # On private repos this step is skipped to avoid spurious failures.
    if: github.event.repository.visibility == 'public'

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            ghcr.io:443
            github.com:443
            pkg-containers.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Pull released image
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          docker pull "ghcr.io/codeswhat/portwing:${VERSION}"

      - name: Verify cosign signature
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cosign verify \
            --certificate-identity="https://github.com/CodesWhat/portwing/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "ghcr.io/codeswhat/portwing:${VERSION}"

      - name: Verify gh attestation
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh attestation verify "oci://ghcr.io/codeswhat/portwing:${VERSION}" \
            --repo CodesWhat/portwing \
            --signer-workflow CodesWhat/portwing/.github/workflows/release.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify-native-packages:
    name: "Verify Native Packages"
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            github.com:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443
            rekor.sigstore.dev:443
            tmaproduction.blob.core.windows.net:443
            tuf-repo-cdn.sigstore.dev:443
            tuf-repo.github.com:443

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Download native packages and signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p packages
          gh release download "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern "*.deb" \
            --pattern "*.deb.bundle" \
            --pattern "*.rpm" \
            --pattern "*.rpm.bundle" \
            --dir packages

      - name: Verify native package signatures
        run: |
          set -euo pipefail
          for package in packages/*.deb packages/*.rpm; do
            cosign verify-blob \
              --certificate-identity="https://github.com/CodesWhat/portwing/.github/workflows/release.yml@refs/tags/${GITHUB_REF_NAME}" \
              --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
              --bundle="${package}.bundle" \
              "${package}"
          done

      # release.yml's "Attest checksummed release assets" step already attests
      # every entry in dist/checksums.txt (archives, native packages, and
      # per-archive SBOMs) via actions/attest-build-provenance. This closes the
      # loop by checking the attestation on the downloaded artifact, the same
      # way verify-published already checks the container manifest's.
      - name: Verify native package build provenance attestation
        if: github.event.repository.visibility == 'public'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for package in packages/*.deb packages/*.rpm; do
            gh attestation verify "${package}" \
              --repo CodesWhat/portwing \
              --signer-workflow CodesWhat/portwing/.github/workflows/release.yml
          done

      - name: Verify deb package install
        run: |
          docker run --rm \
            --volume "${PWD}/packages:/packages:ro" \
            ubuntu:24.04@sha256:4fbb8e6a8395de5a7550b33509421a2bafbc0aab6c06ba2cef9ebffbc7092d90 \
            bash -euxo pipefail -c '
              dpkg --install /packages/portwing_*_linux_amd64.deb
              /usr/bin/portwing version
              test -f /usr/lib/systemd/system/portwing.service
              grep -Fq "ExecStart=/usr/bin/portwing" /usr/lib/systemd/system/portwing.service
            '

      - name: Verify rpm package install
        run: |
          docker run --rm \
            --volume "${PWD}/packages:/packages:ro" \
            fedora:42@sha256:99e203b80b1c3d8f7e161ec10a68fd02b081ef83a3963553e513c82846b97814 \
            bash -euxo pipefail -c '
              rpm --install /packages/portwing_*_linux_amd64.rpm
              /usr/bin/portwing version
              test -f /usr/lib/systemd/system/portwing.service
              grep -Fq "ExecStart=/usr/bin/portwing" /usr/lib/systemd/system/portwing.service
            '

  verify-homebrew:
    name: "Verify Homebrew"
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      HOMEBREW_NO_ANALYTICS: "1"
      HOMEBREW_NO_AUTO_UPDATE: "1"

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            formulae.brew.sh:443
            github.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Verify Homebrew cask install
        run: |
          brew tap CodesWhat/tap https://github.com/CodesWhat/homebrew-tap.git
          brew install --cask codeswhat/tap/portwing
          portwing version
          brew uninstall --cask portwing
