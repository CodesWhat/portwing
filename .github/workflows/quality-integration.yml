name: "Quality: Integration"
run-name: >-
  ${{
    github.event_name == 'schedule' && 'Quality: Integration — Daily' ||
    github.event_name == 'pull_request' && format('Quality: Integration — PR #{0}', github.event.pull_request.number) ||
    format('Quality: Integration — Manual by {0}', github.actor)
  }}

# Runs the build-tagged integration suite against the Linux dockerd
# preinstalled on the GitHub-hosted runner. Tests exercise a real Portwing
# server (TOKEN auth, drydock adapter) pointed at /var/run/docker.sock.
# No dind — the runner's Docker is configured the way a production host would be.

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'  # 06:15 UTC daily
  pull_request:
    paths:
      - 'internal/docker/**'
      - 'internal/adapter/**'
      - 'internal/server/**'
      - 'internal/auth/**'
      - 'internal/config/**'
      - 'internal/edge/**'
      - 'internal/integration/**'
      - 'cmd/**'
      - '.github/workflows/quality-integration.yml'

permissions:
  contents: read

concurrency:
  group: quality-integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: "Integration (real dockerd)"
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a  # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            auth.docker.io:443
            dl.google.com:443
            docker-images-prod.s3.dualstack.us-east-1.amazonaws.com:443
            docker-images-prod.s3.dualstack.us-west-2.amazonaws.com:443
            github.com:443
            go.dev:443
            production.cloudflare.docker.com:443
            production.cloudfront.docker.com:443
            proxy.golang.org:443
            registry-1.docker.io:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install Sockguard
        # The preset evaluator tests in internal/server shell out to
        # `sockguard match` and skip when it is missing. Pinned by version and
        # SHA-256 (from the release's checksums.txt) like the other tools here.
        # The version tracks examples/sockguard-provenance.json's imageTag, and
        # scripts/sockguard-contract.test.mjs fails when the two drift.
        env:
          SOCKGUARD_VERSION: '2.4.6'
          SOCKGUARD_LINUX_AMD64_SHA256: '8365f5c2f253001a7cd33404b385afb5935526645916f6c2ea4cea11a8ae3cb5'
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/sockguard.tar.gz"
          install_dir="${RUNNER_TEMP}/sockguard-bin"
          mkdir -p "${install_dir}"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --silent --show-error --location \
            "https://github.com/CodesWhat/sockguard/releases/download/v${SOCKGUARD_VERSION}/sockguard_${SOCKGUARD_VERSION}_linux_amd64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${SOCKGUARD_LINUX_AMD64_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}" sockguard
          "${install_dir}/sockguard" version
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Verify Docker daemon is reachable
        run: |
          docker version
          docker info --format 'ServerVersion={{.ServerVersion}}'

      - name: Pre-pull alpine sentinel image
        run: docker pull alpine:3.20

      - name: Run integration suite
        env:
          PORTWING_TEST_DOCKER_SOCKET: /var/run/docker.sock
        run: go test -tags=integration -count=1 -timeout=10m -race ./internal/edge/ ./internal/integration/

      - name: Run compose parse-only tier
        # Real `docker compose config` against stacks Portwing writes; needs
        # the compose plugin but not the daemon.
        run: go test -tags=integration -count=1 -timeout=5m -race -run '^(TestComposeConfig(StackEnvQuoting|PerFileModes|ProjectNaming)|TestEnvFileRoundTripsThroughDockerComposeConfig)$' ./internal/docker/

      - name: Run Sockguard preset tests
        # Fails if the evaluator tests skip, which is what happens when the
        # pinned binary is not on PATH.
        run: |
          set -euo pipefail
          go test -count=1 -v -run 'TestSockguardPresets' ./internal/server/ | tee "${RUNNER_TEMP}/sockguard-tests.log"
          if grep -q -- '--- SKIP' "${RUNNER_TEMP}/sockguard-tests.log"; then
            echo "Sockguard preset tests skipped; the pinned binary is not on PATH" >&2
            exit 1
          fi
