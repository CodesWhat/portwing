name: "Quality: Soak"
run-name: >-
  ${{
    github.event_name == 'schedule' && 'Quality: Soak — Weekly' ||
    format('Quality: Soak — Manual by {0}', github.actor)
  }}

# RSS-growth soak. Runs the Portwing agent (generic adapter) in front of
# a mock Docker daemon under a sustained loadgen mix — cached-inventory reads,
# version/info, a raw Docker proxy read, and a stream of SSE subscribers that
# connect/hold/disconnect (the leak-prone path) — and asserts the agent's
# working-set growth stays inside a configured threshold. This is the
# long-lived-agent leak signal the unit/integration/fuzz tiers can't give.
#
# GitHub-hosted runners cap a single job at 6h, so the scheduled run soaks for
# 4h — enough wall time that a per-request allocation/goroutine leak shows up as
# multiple-MiB RSS growth well above the 64 MiB threshold. The 24h target lives
# on once a self-hosted runner is wired up; the manual dispatch inputs let a
# maintainer override the duration for that, or shorten it for a one-off check.

on:
  workflow_dispatch:
    inputs:
      duration:
        description: "Soak duration (Go time.Duration; e.g. 30m, 4h)"
        required: false
        default: "4h"
      concurrency:
        description: "Concurrent loadgen workers for the inventory scenario"
        required: false
        default: "20"
      rss_growth_threshold_bytes:
        description: "Fail if VmRSS grows by more than this many bytes from the post-warmup baseline"
        required: false
        default: "67108864"
  schedule:
    - cron: '15 6 * * 0'  # Sundays 06:15 UTC

permissions:
  contents: read

concurrency:
  group: quality-soak-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  soak:
    name: "Soak (portwing RSS growth)"
    runs-on: ubuntu-24.04
    # Allow 30 minutes for build + warmup + post-run reporting on top of the
    # 4-hour soak; well under the 6-hour github-hosted ceiling.
    timeout-minutes: 270

    # Deliberately read-only. This job builds and runs the agent under load
    # for four hours, so it is the last place a write-scoped credential
    # belongs; the `history` job below does the writing and runs nothing but
    # checkout, an artifact download, jq and git. What that job needs from
    # here travels as job outputs and as the soak-output.txt artifact.
    outputs:
      duration: ${{ steps.params.outputs.duration }}
      concurrency: ${{ steps.params.outputs.concurrency }}
      rss_threshold: ${{ steps.params.outputs.rss_threshold }}
      outcome: ${{ steps.soak.outcome }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: block
          # The 4-hour soak needs runner control/log/artifact traffic throughout
          # the job, not just checkout/setup traffic.
          allowed-endpoints: >
            168.63.129.16:80
            api.github.com:443
            agent.api.stepsecurity.io:443
            codeload.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            *.githubapp.com:443
            prod.app-api.stepsecurity.io:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Resolve soak parameters
        id: params
        env:
          INPUT_DURATION: ${{ github.event.inputs.duration }}
          INPUT_CONCURRENCY: ${{ github.event.inputs.concurrency }}
          INPUT_RSS_THRESHOLD: ${{ github.event.inputs.rss_growth_threshold_bytes }}
        run: |
          # Scheduled runs see empty inputs and fall back to these defaults.
          {
            echo "duration=${INPUT_DURATION:-4h}"
            echo "concurrency=${INPUT_CONCURRENCY:-20}"
            echo "rss_threshold=${INPUT_RSS_THRESHOLD:-67108864}"
          } >> "$GITHUB_OUTPUT"

      - name: Validate the soak script accepts the resolved parameters
        env:
          # Pull inputs through env vars so the shell never interpolates raw
          # `${{ … }}` — closes zizmor's template-injection audit even though
          # soak.sh re-validates downstream.
          SOAK_DURATION: ${{ steps.params.outputs.duration }}
          SOAK_CONCURRENCY: ${{ steps.params.outputs.concurrency }}
          SOAK_RSS_THRESHOLD: ${{ steps.params.outputs.rss_threshold }}
        run: |
          scripts/soak.sh --dry-run \
            --duration "${SOAK_DURATION}" \
            --concurrency "${SOAK_CONCURRENCY}" \
            --rss-growth-threshold-bytes "${SOAK_RSS_THRESHOLD}"

      - name: Run soak
        id: soak
        env:
          SOAK_DURATION: ${{ steps.params.outputs.duration }}
          SOAK_CONCURRENCY: ${{ steps.params.outputs.concurrency }}
          SOAK_RSS_THRESHOLD: ${{ steps.params.outputs.rss_threshold }}
        # shell: bash (rather than the default `bash -e {0}`) is required here:
        # GitHub's default bash has -e but not -o pipefail, so `| tee` would
        # report tee's exit code and mask a failing soak run.
        shell: bash
        run: |
          scripts/soak.sh \
            --duration "${SOAK_DURATION}" \
            --concurrency "${SOAK_CONCURRENCY}" \
            --rss-growth-threshold-bytes "${SOAK_RSS_THRESHOLD}" \
            | tee soak-output.txt

      - name: Upload soak output
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: soak-output-${{ github.run_id }}
          path: soak-output.txt
          retention-days: 90

      - name: Summarize
        if: always()
        env:
          SOAK_DURATION: ${{ steps.params.outputs.duration }}
          SOAK_CONCURRENCY: ${{ steps.params.outputs.concurrency }}
          SOAK_RSS_THRESHOLD: ${{ steps.params.outputs.rss_threshold }}
        run: |
          {
            echo "### Portwing soak"
            echo "- Duration:            ${SOAK_DURATION}"
            echo "- Concurrency:         ${SOAK_CONCURRENCY}"
            echo "- RSS threshold:       ${SOAK_RSS_THRESHOLD} bytes"
            echo ""
            echo "Last 20 lines of soak output:"
            echo '```'
            tail -n 20 soak-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # PW-5.5. Everything the soak job produces is visible for exactly one run:
  # the step summary belongs to the run, and soak-output.txt is a 90-day
  # artifact you have to know to go looking for. An RSS leak that grows a few
  # MiB a week never trips the 64 MiB threshold on any single run and is
  # invisible in all of them, which is the regression this lane is supposed to
  # catch. Appending the headline numbers to the quality-history branch is what
  # makes the fourth run comparable to the first.
  #
  # This is a separate job, and that is the whole point of it. `contents:
  # write` has to live somewhere for the push to work, and the soak job spends
  # four hours building and running the agent, loadgen and a mock daemon from
  # the workspace. A write-scoped credential in that job would be reachable by
  # anything those steps could have rewritten, including the append script
  # itself. This job checks the tree out fresh at the run's own SHA and then
  # runs nothing but an artifact download, jq and git, so the credential never
  # coexists with executed product code. The downloaded artifact is data: it is
  # validated as JSON and passed as an argument, never sourced or evaluated.
  #
  # always(), because a soak that blew its budget is the run whose numbers
  # matter most; the record carries the outcome so a reader can tell.
  history:
    name: "Record the soak run in the quality history"
    needs: soak
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c  # v2.21.0
        with:
          egress-policy: block
          # The union of two endpoint sets already proven in this repository:
          # ci-verify.yml's coverage job downloads an artifact with
          # results-receiver, and this workflow's own soak job lists the blob
          # host for artifact traffic. github.com carries the checkout and the
          # git push; there is no other network call in this job.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download the soak output
        id: output
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: soak-output-${{ github.run_id }}
          path: .

      - name: Append the run to the quality history
        env:
          QUALITY_HISTORY_CREDENTIAL: ${{ secrets.GITHUB_TOKEN }}
          QUALITY_HISTORY_EVENT: ${{ github.event_name }}
          SOAK_DURATION: ${{ needs.soak.outputs.duration }}
          SOAK_CONCURRENCY: ${{ needs.soak.outputs.concurrency }}
          SOAK_RSS_THRESHOLD: ${{ needs.soak.outputs.rss_threshold }}
          SOAK_OUTCOME: ${{ needs.soak.outputs.outcome || needs.soak.result }}
        run: |
          # The RSS numbers are read back from the line scripts/soak.sh already
          # prints, not recomputed: soak.sh owns the baseline/final sampling
          # and the growth arithmetic, and a second implementation here would
          # be free to disagree with the number the lane actually gated on.
          baseline=""
          final=""
          growth=""
          headline="$(grep -E '^soak: baseline=' soak-output.txt 2>/dev/null | tail -n 1 || true)"
          if [[ "${headline}" =~ baseline=([0-9]+)\ KiB[[:space:]]+final=([0-9]+)\ KiB[[:space:]]+growth=(-?[0-9]+)\ B ]]; then
            baseline="${BASH_REMATCH[1]}"
            final="${BASH_REMATCH[2]}"
            growth="${BASH_REMATCH[3]}"
          else
            echo "::warning::No 'soak: baseline=' line in soak-output.txt; recording the run without RSS numbers."
          fi

          # loadgen writes one JSON object per scenario into the same output,
          # so the request and error totals come for free. A soak that grew
          # nothing because it served almost nothing is a green run that
          # measured nothing, and these two columns are what makes that
          # visible in the series.
          totals='{}'
          scenarios="$(grep -E '^\{' soak-output.txt 2>/dev/null || true)"
          if [ -n "${scenarios}" ]; then
            totals="$(printf '%s\n' "${scenarios}" | jq -cs '{
              total_requests: (map(.total_requests // 0) | add),
              error_requests: (map(.error_requests // 0) | add)
            }' 2>/dev/null || echo '{}')"
          fi

          numbers="$(jq -cn \
            --arg duration "${SOAK_DURATION}" \
            --arg concurrency "${SOAK_CONCURRENCY}" \
            --arg threshold "${SOAK_RSS_THRESHOLD}" \
            --arg baseline "${baseline}" \
            --arg final "${final}" \
            --arg growth "${growth}" \
            --arg outcome "${SOAK_OUTCOME}" \
            --argjson totals "${totals}" \
            '{
              duration: $duration,
              concurrency: ($concurrency | tonumber? // null),
              rss_threshold_bytes: ($threshold | tonumber? // null),
              baseline_rss_kib: ($baseline | tonumber? // null),
              final_rss_kib: ($final | tonumber? // null),
              rss_growth_bytes: ($growth | tonumber? // null),
              outcome: (if $outcome == "" then "skipped" else $outcome end)
            } + $totals')"

          scripts/ci/quality-history-append.sh soak "${numbers}"
