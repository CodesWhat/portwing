name: "CI"
run-name: >-
  ${{
    github.event_name == 'schedule' && 'CI — Weekly schedule' ||
    github.event_name == 'pull_request' && format('CI — PR #{0}', github.event.pull_request.number) ||
    format('CI — {0}', github.ref_name)
  }}

on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main, "dev/**"]
  schedule:
    - cron: '30 6 * * 1'  # Weekly on Monday at 06:30 UTC

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  go-ci:
    name: "Go CI"
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: CodesWhat/.github/.github/workflows/go-ci.yml@01bf40b06b110946f12a49b82e407d77c6480df7
    with:
      go-version-file: go.mod
      go-cache-dependency-path: go.sum
      test-check-name: Build & Test
      lint-check-name: Lint
      fuzzers-json: >-
        ${{ (github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '[{"name":"FuzzParsePHC","pkg":"./internal/server/"},{"name":"FuzzParseTrustedProxies","pkg":"./internal/server/"},{"name":"FuzzParseImageRef","pkg":"./internal/adapter/"},{"name":"FuzzParseLabels","pkg":"./internal/adapter/drydock/"},{"name":"FuzzMCPHandler","pkg":"./internal/mcp/"},{"name":"FuzzEnvelope","pkg":"./internal/protocol/"},{"name":"FuzzVerifyRequest","pkg":"./internal/auth/"}]' || '[]' }}
      run-govulncheck: true
      run-qlty: ${{ github.event_name != 'schedule' }}
      run-goreleaser: ${{ github.event_name != 'schedule' }}
      run-workflow-security: true
      run-commit-message: true
      test-egress-policy: block
      test-allowed-endpoints: >-
        api.github.com:443
        dl.google.com:443
        github.com:443
        go.dev:443
        proxy.golang.org:443
        release-assets.githubusercontent.com:443
        sum.golang.org:443
        tmaproduction.blob.core.windows.net:443
      lint-egress-policy: block
      lint-allowed-endpoints: >-
        api.github.com:443
        dl.google.com:443
        github.com:443
        go.dev:443
        proxy.golang.org:443
        release-assets.githubusercontent.com:443
        storage.googleapis.com:443
        sum.golang.org:443
        tmaproduction.blob.core.windows.net:443
      govulncheck-egress-policy: block
      govulncheck-allowed-endpoints: >-
        api.github.com:443
        dl.google.com:443
        github.com:443
        go.dev:443
        proxy.golang.org:443
        release-assets.githubusercontent.com:443
        sum.golang.org:443
        tmaproduction.blob.core.windows.net:443
        vuln.go.dev:443
      workflow-security-egress-policy: block
      workflow-security-allowed-endpoints: >-
        ghcr.io:443
        github.com:443
        pkg-containers.githubusercontent.com:443
      commit-message-egress-policy: block
      commit-message-allowed-endpoints: github.com:443
      goreleaser-egress-policy: block
      goreleaser-allowed-endpoints: >-
        api.github.com:443
        dl.google.com:443
        github.com:443
        go.dev:443
        proxy.golang.org:443
        release-assets.githubusercontent.com:443
        storage.googleapis.com:443
        sum.golang.org:443
        tmaproduction.blob.core.windows.net:443
      qlty-egress-policy: block
      qlty-allowed-endpoints: >-
        api.github.com:443
        api.osv.dev:443
        api.segment.io:443
        api0.prismacloud.io:443
        check.trivy.dev:443
        dl.google.com:443
        files.pythonhosted.org:443
        github-proxy.qlty.sh:443
        github.com:443
        go.dev:443
        mirror.gcr.io:443
        nodejs.org:443
        objects.githubusercontent.com:443
        proxy.golang.org:443
        pypi.org:443
        qlty-releases.s3.amazonaws.com:443
        radarlint-releases.s3.amazonaws.com:443
        registry.npmjs.org:443
        release-assets.githubusercontent.com:443
        sum.golang.org:443
        tmaproduction.blob.core.windows.net:443
        tuf-repo-cdn.sigstore.dev:443
        tuf-repo.github.com:443
      fuzz-egress-policy: block
      fuzz-allowed-endpoints: >-
        api.github.com:443
        dl.google.com:443
        github.com:443
        go.dev:443
        proxy.golang.org:443
        release-assets.githubusercontent.com:443
        tmaproduction.blob.core.windows.net:443

  node-ci:
    name: "Node CI"
    if: github.event_name != 'schedule'
    permissions:
      contents: read
    uses: CodesWhat/.github/.github/workflows/node-ci.yml@01bf40b06b110946f12a49b82e407d77c6480df7
    with:
      node-version: 24
      lockfile-path: package-lock.json
      test-check-name: Web Contract
      run-test: true
      test-egress-policy: block
      test-allowed-endpoints: >-
        api.github.com:443
        fonts.googleapis.com:443
        fonts.gstatic.com:443
        github.com:443
        registry.npmjs.org:443
        release-assets.githubusercontent.com:443

  codecov:
    name: "Coverage: Codecov Upload"
    needs: go-ci
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.codecov.io:443
            api.github.com:443
            cli.codecov.io:443
            github.com:443
            ingest.codecov.io:443
            keybase.io:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Download Go test artifacts
        # go-ci's "test" job (Build & Test) uploads coverage.out from
        # artifacts/go-test/ under this name, always, even if a later step
        # in that job fails.
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: go-test-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/go-test
        continue-on-error: true

      - name: Upload coverage to Codecov
        # Tokenless OIDC upload -- no CODECOV_TOKEN to store or rotate, and
        # skipped implicitly on fork PRs (no id-token grant). Non-gating by
        # design: the vendor-free coverage floor enforced in
        # scripts/ci/go-test.sh is the real gate, so a Codecov hiccup never
        # flakes the required "Build & Test" context.
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f  # v7.0.0
        with:
          files: artifacts/go-test/coverage.out
          use_oidc: true
          fail_ci_if_error: false
        continue-on-error: true

  secrets:
    name: "Security: Secrets"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore scanner policy from the base ref
        # A PR must not be able to alter the gate that scans it: restore the
        # scanner script and ignore policy from the protected base ref, so
        # policy changes only take effect after they merge.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}"
          git checkout FETCH_HEAD -- scripts/scan-secrets.sh .gitleaks.toml .gitleaksignore

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${install_dir}"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}" gitleaks
          "${install_dir}/gitleaks" version
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Scan secrets
        run: scripts/scan-secrets.sh

  codeql:
    name: "CodeQL Analysis"
    # Keep this job local: the explicit category preserves the default-branch
    # code-scanning identity while the organization workflow is canaried.
    if: github.event.repository.visibility == 'public' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev/'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          languages: actions, go
          queries: security-and-quality

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build Go
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3  # v4.37.6
        with:
          category: .github/workflows/ci.yml:codeql

  dependency-review:
    name: "Dependency Review"
    if: github.event.repository.visibility == 'public' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920  # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
