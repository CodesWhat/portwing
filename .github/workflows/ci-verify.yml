name: "CI"
run-name: >-
  ${{
    github.event_name == 'schedule' && 'CI — Weekly schedule' ||
    github.event_name == 'pull_request' && format('CI — PR #{0}', github.event.pull_request.number) ||
    format('CI — {0}', github.ref_name)
  }}

# A promotion PR (dev/v1.0 -> main) whose tree equals a dev tree that a full
# push run already verified runs a "tree receipt" variant of Go CI (see the
# "Tree receipt" step in the changes job and ci-go-receipt.yml). Every required
# context still reports SUCCESS from the PR run; nothing is skipped.
on:
  push:
    branches: [main, "dev/**"]
  pull_request:
    branches: [main, "dev/**"]
  schedule:
    - cron: '30 6 * * 1'  # Weekly on Monday at 06:30 UTC

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One push to a branch with an open pull request fires two runs on the same
  # SHA: `push` and `pull_request`. Only a dev/** head can hit this (feature
  # branches aren't push-triggered), and in practice that is the standing
  # dev/v1.0 -> main promotion PR, the one PR whose required contexts matter.
  # The run that matters is the pull_request one: it carries the PR-only jobs
  # (commit-message, dependency-review diff, base-ref scanner policy), and the
  # required contexts on main are reported by it.
  #
  # So the push run stands down when an open PR already covers its SHA. How
  # it stands down has to be right, because checks attach to the head SHA and a
  # skipped or step-skipped push-run job can satisfy, or race, the PR run's
  # required context. Only jobs that post no required name when skipped are
  # skipped:
  #
  #   * Go CI, Node CI and the Codecov upload skip at the job level. A skipped
  #     reusable caller posts a single "Go CI" or "Node CI" entry and never
  #     instantiates the nested contexts, so none of the required "Go CI / ..."
  #     names gets a result from this run. "Node CI" and "Coverage: Codecov
  #     Upload" are not required contexts.
  #   * Every other required job (CodeQL Analysis, Website Browser Checks,
  #     Security: Secrets, Dependency Review, Release Contract) runs in full on
  #     every run that runs it today. Never skip a step inside a required job
  #     either: a step-skipped success on the covered push would satisfy the
  #     context with no work done if the PR run's own job is cancelled or
  #     still queued.
  #
  # Pushes to main never stand down: release-cut.yml waits for a successful
  # run of this workflow on main HEAD, and the merged promotion PR is closed by
  # then anyway. A push to dev/** with no open PR (a feature PR merged into
  # dev/v1.0) runs in full, since that SHA has never been verified. When the
  # lookup fails the answer is "not covered" and the run does everything.
  #
  changes:
    name: "Changed Paths"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      push_covered: ${{ steps.covered.outputs.push_covered }}
      receipt: ${{ steps.receipt.outputs.receipt }}
      receipt_run: ${{ steps.receipt.outputs.receipt_run }}
      receipt_sha: ${{ steps.receipt.outputs.receipt_sha }}
      fuzzers_json: ${{ steps.fuzzers.outputs.fuzzers_json }}
    steps:
      # Block, because this job runs setup-go (scripts/setup-go-egress-config-test.sh
      # requires it). `go list` resolves the module's external imports even
      # without -deps, so on a cold runner it needs the module proxy and the
      # checksum database as well as the toolchain-download hosts.
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          disable-sudo: true
          allowed-endpoints: >
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            storage.googleapis.com:443
            sum.golang.org:443
            tmaproduction.blob.core.windows.net:443

      - name: Is this push covered by a pull request run
        id: covered
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # No `-e`: a failed lookup must mean "not covered", never a red job.
          covered=false
          case "${EVENT_NAME}:${REF}" in
            push:refs/heads/dev/*)
              # Only a PR into main or dev/** gets a pull_request run from this
              # workflow, so only those can stand in for the push run.
              numbers="$(gh api "repos/${REPO}/commits/${SHA}/pulls" --paginate 2>/dev/null |
                jq -s -r --arg sha "${SHA}" '.[][] | select(.state == "open" and .head.sha == $sha and (.base.ref == "main" or (.base.ref | startswith("dev/")))) | .number' 2>/dev/null)" || numbers=""
              for number in ${numbers}; do
                # An open PR is not enough: GitHub creates no pull_request run
                # for a PR with a merge conflict, because there is no merge
                # commit to check out. mergeable_state says whether there is
                # one: clean, unstable (non-required checks failing), blocked
                # (required checks or reviews missing) and behind (base moved
                # but merges cleanly) all have a mergeable merge commit, so the
                # PR run will exist. dirty is a conflict; unknown/null means
                # GitHub is still computing it; draft, has_hooks and anything
                # new say nothing about conflicts. None of those is covered.
                # The first read is what kicks off the computation, so give an
                # unsettled answer a few seconds, up to three reads.
                for attempt in 1 2 3; do
                  state="$(gh api "repos/${REPO}/pulls/${number}" --jq '.mergeable_state' 2>/dev/null)" || state=""
                  case "${state}" in
                    "" | null | unknown) [ "${attempt}" -lt 3 ] && sleep 5 ;;
                    *) break ;;
                  esac
                done
                case "${state}" in
                  clean | unstable | blocked | behind) covered=true ;;
                esac
              done
              ;;
          esac
          echo "push_covered=${covered}" >> "$GITHUB_OUTPUT"

      - name: Tree receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # Tree receipt. A promotion PR repeats a tree the dev push run verified
          # when its head is a dev/** branch of this repo, its merge result adds
          # nothing to that head (merge tree == head tree), and a successful push
          # run of this workflow on that branch ran the tree-only Go gates against
          # an identical tree. Then ci-go-receipt.yml runs in place of the org Go CI
          # and reports Lint, Workflow Security, GoReleaser Config and Qlty Check
          # from the receipt, at step level, so every required context is SUCCESS
          # rather than SKIPPED. Everything else (Build & Test, Govulncheck,
          # Commit Message, fuzzing, CodeQL, Website Browser Checks, Secrets,
          # Dependency Review, Release Contract) runs in full.
          #
          # The receipt run must itself have run the gates for real: the jobs API is
          # read and each gate must be a success there, which rules out a push run
          # that stood down as covered, and a PR run that used a receipt. Any API
          # error (the newest candidate's jobs included), missing run or doubt means "no receipt" and the full run.
          # No `-e`: a failed lookup must mean "no receipt", never a red job.
          receipt=false
          receipt_run=""
          receipt_sha=""
          reason="not a promotion pull request"
          gates=("Go CI / Build & Test" "Go CI / Govulncheck" "Go CI / Lint" "Go CI / Workflow Security" "Go CI / GoReleaser Config" "Go CI / Qlty Check")

          if [ "${EVENT_NAME}" = "pull_request" ] && [ "${BASE_REF}" = "main" ] && [ "${HEAD_REPO}" = "${REPO}" ]; then
            case "${HEAD_REF}" in
              dev/*)
                head_tree="$(gh api "repos/${REPO}/git/commits/${HEAD_SHA}" --jq .tree.sha 2>/dev/null)" || head_tree=""
                merge_tree="$(gh api "repos/${REPO}/git/commits/${MERGE_SHA}" --jq .tree.sha 2>/dev/null)" || merge_tree=""
                if [ -z "${head_tree}" ] || [ -z "${merge_tree}" ]; then
                  reason="could not read the head or merge tree"
                elif [ "${head_tree}" != "${merge_tree}" ]; then
                  reason="the merge result differs from the PR head tree"
                else
                  reason="no successful push run on ${HEAD_REF} verified tree ${head_tree}"
                  runs="$(gh api "repos/${REPO}/actions/workflows/ci-verify.yml/runs?event=push&status=success&branch=${HEAD_REF}&per_page=50" 2>/dev/null |
                    jq -r --arg tree "${head_tree}" '[.workflow_runs[] | select(.conclusion == "success" and .head_commit.tree_id == $tree)] | sort_by(.created_at) | reverse | .[0:5][] | "\(.id) \(.head_sha)"' 2>/dev/null)" || runs=""
                  while read -r id sha; do
                    [ -n "${id}" ] || continue
                    # An API error is doubt, not a stood-down run: stop here rather
                    # than fall through to an older candidate.
                    if ! jobs="$(gh api "repos/${REPO}/actions/runs/${id}/jobs?per_page=100" --paginate 2>/dev/null | jq -s '[.[].jobs[]]' 2>/dev/null)" || [ -z "${jobs}" ]; then
                      reason="could not read the jobs of ci-verify run ${id}"
                      break
                    fi
                    ok=true
                    for gate in "${gates[@]}"; do
                      jq -e --arg gate "${gate}" 'any(.[]; .name == $gate and .conclusion == "success")' <<<"${jobs}" >/dev/null 2>&1 || ok=false
                    done
                    if [ "${ok}" = true ]; then
                      receipt=true
                      receipt_run="${id}"
                      receipt_sha="${sha}"
                      reason="tree ${head_tree} verified by ci-verify run ${id} on ${sha}"
                      break
                    fi
                  done <<<"${runs}"
                fi
                ;;
              *) reason="head is not a dev/** branch of this repository" ;;
            esac
          fi

          echo "Tree receipt: ${receipt} (${reason})"
          {
            echo "receipt=${receipt}"
            echo "receipt_run=${receipt_run}"
            echo "receipt_sha=${receipt_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # need base-branch history to diff a PR against it

      # select-fuzzers.py builds the import graph with `go list`, which needs
      # the module's own toolchain rather than whatever the runner image has.
      - name: Setup Go
        if: github.event_name == 'pull_request'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The selector's cases that run a real `go list` live in
      # scripts/ci/select-fuzzers.go.test.mjs, outside the `scripts/*.test.mjs`
      # glob that `npm run test:web` (Node CI, no Go, block egress) runs.
      - name: Test the fuzzer selector
        if: github.event_name == 'pull_request'
        run: node --test scripts/ci/select-fuzzers.go.test.mjs

      # A PR fuzzes only the fuzzers whose package, or a package that one
      # imports, it touches. The weekly schedule and pushes to main run the
      # whole list, and so do the nightly and monthly fuzz workflows. The list
      # lives in .github/ci-fuzzers.json; the selection is
      # scripts/ci/select-fuzzers.sh. Fuzz job names are not required
      # contexts, so an empty list needs no skipped-green reporting: the Go
      # Fuzz matrix just has no legs.
      - name: Select fuzzers
        id: fuzzers
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -uo pipefail
          # No `-e`: a failed selection must fall back to the full list.
          list=.github/ci-fuzzers.json

          if [ "${EVENT_NAME}" = "schedule" ] || { [ "${EVENT_NAME}" = "push" ] && [ "${REF}" = "refs/heads/main" ]; }; then
            echo "fuzzers_json=$(jq -c . "${list}")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "fuzzers_json=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git fetch --quiet origin "${BASE_REF}" || ! selected="$(bash scripts/ci/select-fuzzers.sh "origin/${BASE_REF}" "${list}")" || [ -z "${selected}" ]; then
            echo "::warning::changes: could not select fuzzers, running every fuzzer"
            selected="$(jq -c . "${list}")"
          fi
          echo "fuzzers_json=${selected}" >> "$GITHUB_OUTPUT"

  go-ci:
    name: "Go CI"
    needs: changes
    # `!cancelled()` so a failed changes job runs everything rather than
    # skipping it (an empty push_covered is not 'true').
    if: ${{ !cancelled() && needs.changes.outputs.push_covered != 'true' && needs.changes.outputs.receipt != 'true' }}
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: CodesWhat/.github/.github/workflows/go-ci.yml@684a6b931e7802f1985e2cb4f6ea0c95861988e3  # main, 2026-11-26
    with:
      go-version-file: go.mod
      go-cache-dependency-path: go.sum
      test-check-name: Build & Test
      lint-check-name: Lint
      # An empty list produces no matrix jobs at all: go-ci.yml's fuzz job is
      # gated on `fromJSON(inputs.fuzzers-json)[0] != null`. The changes job
      # picks the list (see "Select fuzzers"). If it didn't succeed or wrote
      # nothing, fail toward the FULL list on every event that fuzzes (PRs, the
      # weekly schedule, pushes to main), never toward `[]`. The full list is
      # inlined because the reusable workflow is frozen at an org SHA and can't
      # expand a sentinel from .github/ci-fuzzers.json; the contract tests pin
      # this copy to that file. Other pushes fuzz nothing. None of these is a
      # required context.
      fuzzers-json: >-
        ${{ (needs.changes.result == 'success' && needs.changes.outputs.fuzzers_json) || ((github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '[{"name":"FuzzParsePHC","pkg":"./internal/server/"},{"name":"FuzzParseTrustedProxies","pkg":"./internal/server/"},{"name":"FuzzParseImageRef","pkg":"./internal/adapter/"},{"name":"FuzzParseLabels","pkg":"./internal/adapter/drydock/"},{"name":"FuzzMCPHandler","pkg":"./internal/mcp/"},{"name":"FuzzEnvelope","pkg":"./internal/protocol/"},{"name":"FuzzVerifyRequest","pkg":"./internal/auth/"},{"name":"FuzzDecodeContainerLogStream","pkg":"./internal/docker/"},{"name":"FuzzComposeRequestValidate","pkg":"./internal/docker/"},{"name":"FuzzParseKeyLine","pkg":"./internal/auth/"},{"name":"FuzzEdgeRequestPath","pkg":"./internal/edge/"}]' || '[]') }}
      run-govulncheck: true
      run-qlty: ${{ github.event_name != 'schedule' }}
      run-goreleaser: ${{ github.event_name != 'schedule' }}
      run-workflow-security: true
      run-commit-message: true
      test-egress-policy: block
      test-allowed-endpoints: >-
        api.github.com:443
        dl.google.com:443
        github.com:443
        go.dev:443
        proxy.golang.org:443
        release-assets.githubusercontent.com:443
        sum.golang.org:443
        tmaproduction.blob.core.windows.net:443
      lint-egress-policy: block
      lint-allowed-endpoints: >-
        api.github.com:443
        dl.google.com:443
        github.com:443
        go.dev:443
        proxy.golang.org:443
        release-assets.githubusercontent.com:443
        storage.googleapis.com:443
        sum.golang.org:443
        tmaproduction.blob.core.windows.net:443
      govulncheck-egress-policy: block
      govulncheck-allowed-endpoints: >-
        api.github.com:443
        dl.google.com:443
        github.com:443
        go.dev:443
        proxy.golang.org:443
        release-assets.githubusercontent.com:443
        sum.golang.org:443
        tmaproduction.blob.core.windows.net:443
        vuln.go.dev:443
      workflow-security-egress-policy: block
      workflow-security-allowed-endpoints: >-
        files.pythonhosted.org:443
        ghcr.io:443
        github.com:443
        pkg-containers.githubusercontent.com:443
        pypi.org:443
      commit-message-egress-policy: block
      commit-message-allowed-endpoints: github.com:443
      goreleaser-egress-policy: block
      goreleaser-allowed-endpoints: >-
        api.github.com:443
        dl.google.com:443
        github.com:443
        go.dev:443
        proxy.golang.org:443
        release-assets.githubusercontent.com:443
        storage.googleapis.com:443
        sum.golang.org:443
        tmaproduction.blob.core.windows.net:443
      qlty-egress-policy: block
      qlty-allowed-endpoints: >-
        api.github.com:443
        api.osv.dev:443
        api.segment.io:443
        api0.prismacloud.io:443
        dl.google.com:443
        files.pythonhosted.org:443
        github-proxy.qlty.sh:443
        github.com:443
        go.dev:443
        mirror.gcr.io:443
        nodejs.org:443
        objects.githubusercontent.com:443
        proxy.golang.org:443
        pypi.org:443
        qlty-releases.s3.amazonaws.com:443
        radarlint-releases.s3.amazonaws.com:443
        registry.npmjs.org:443
        release-assets.githubusercontent.com:443
        storage.googleapis.com:443
        sum.golang.org:443
        tmaproduction.blob.core.windows.net:443
        tuf-repo-cdn.sigstore.dev:443
        tuf-repo.github.com:443
      fuzz-egress-policy: block
      fuzz-allowed-endpoints: >-
        api.github.com:443
        dl.google.com:443
        github.com:443
        go.dev:443
        proxy.golang.org:443
        release-assets.githubusercontent.com:443
        tmaproduction.blob.core.windows.net:443

  # The tree-receipt variant of go-ci: same "Go CI" caller name, so the nested
  # contexts keep their required names. Mutually exclusive with go-ci.
  go-ci-receipt:
    name: "Go CI"
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.push_covered != 'true' && needs.changes.outputs.receipt == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci-go-receipt.yml  # zizmor: ignore[self-repository]
    with:
      receipt-run-id: ${{ needs.changes.outputs.receipt_run }}
      receipt-sha: ${{ needs.changes.outputs.receipt_sha }}
      go-version-file: go.mod
      go-cache-dependency-path: go.sum
      fuzzers-json: >-
        ${{ (needs.changes.result == 'success' && needs.changes.outputs.fuzzers_json) || ((github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && '[{"name":"FuzzParsePHC","pkg":"./internal/server/"},{"name":"FuzzParseTrustedProxies","pkg":"./internal/server/"},{"name":"FuzzParseImageRef","pkg":"./internal/adapter/"},{"name":"FuzzParseLabels","pkg":"./internal/adapter/drydock/"},{"name":"FuzzMCPHandler","pkg":"./internal/mcp/"},{"name":"FuzzEnvelope","pkg":"./internal/protocol/"},{"name":"FuzzVerifyRequest","pkg":"./internal/auth/"},{"name":"FuzzDecodeContainerLogStream","pkg":"./internal/docker/"},{"name":"FuzzComposeRequestValidate","pkg":"./internal/docker/"},{"name":"FuzzParseKeyLine","pkg":"./internal/auth/"},{"name":"FuzzEdgeRequestPath","pkg":"./internal/edge/"}]' || '[]') }}

  node-ci:
    name: "Node CI"
    needs: changes
    if: ${{ !cancelled() && github.event_name != 'schedule' && needs.changes.outputs.push_covered != 'true' }}
    permissions:
      contents: read
    uses: CodesWhat/.github/.github/workflows/node-ci.yml@684a6b931e7802f1985e2cb4f6ea0c95861988e3  # main, 2026-11-26
    with:
      node-version: 26
      lockfile-path: package-lock.json
      test-check-name: Web Contract
      run-test: true
      # run-lint and run-build stay off on purpose: "Web Contract" already
      # runs `npm run check:web`, which covers lint and build. Turning them on
      # would gate the same property twice.
      #
      # The names are set so they are right if those jobs are ever enabled.
      # They do NOT fix the cosmetic reporting: node-ci.yml declares both jobs
      # as `name: ${{ inputs.*-check-name }}` under `if: inputs.run-*`, and
      # GitHub does not evaluate an expression in a job's name when the job
      # skips. Passing the input explicitly changes nothing — measured on
      # PR #175, where the checks still reported as the literal
      # "Node CI / inputs.lint-check-name" with these very lines in place, and
      # upstream already defaults them to "Node Lint"/"Node Build" anyway.
      # Fixing it properly means a literal `name:` upstream in node-ci.yml.
      # Neither name is a required context, so nothing is gated on it.
      lint-check-name: Web Lint
      build-check-name: Web Build
      test-egress-policy: block
      test-allowed-endpoints: >-
        api.github.com:443
        fonts.googleapis.com:443
        fonts.gstatic.com:443
        github.com:443
        registry.npmjs.org:443
        release-assets.githubusercontent.com:443

  website-browser-checks:
    name: "Website Browser Checks"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    # The suite itself is about a minute. The rest is the image pull, npm ci and the site build.
    # Kept short on purpose: hosted runners kill sustained-CPU jobs past ~14 minutes.
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      # The browsers ship in this image, so nothing downloads them from cdn.playwright.dev (whose
      # block-mode DNS answers disagree with harden-runner, upstream harden-runner#708). The tag
      # must match the exact @playwright/test version; the digest pins the linux/amd64 image.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:766137e2d9caad4744187e53cdc89320ba6f2eb57cff097374020944b44dd0a9

    steps:
      # The image runs through `docker run` on the host rather than a job-level `container:`,
      # because Harden Runner hardens the VM it is started on and its steps would otherwise
      # run inside the container, outside what it can enforce.
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          # mcr.microsoft.com and its data host: the image pull. registry.npmjs.org: npm ci inside
          # the container. The last three are artifact upload on failure.
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            mcr.microsoft.com:443
            *.data.mcr.microsoft.com:443
            registry.npmjs.org:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # npm ci, the site build (the tests serve website/out) and the suite, all inside the image.
      # The Node check keeps the image honest against the repo's pin in .node-version.
      - name: Run browser checks
        run: |
          docker run --rm --ipc=host --user "$(id -u):$(id -g)" \
            --env CI=true --env HOME=/tmp/home \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work \
            "$PLAYWRIGHT_IMAGE" \
            bash -euo pipefail -c '
              mkdir -p "$HOME"
              node -v
              node scripts/node-version-contract.mjs
              npm ci
              npm run build
              npm run test:browser
            '

      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: website-browser-checks-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  codecov:
    name: "Coverage: Codecov Upload"
    needs: [changes, go-ci, go-ci-receipt]
    if: ${{ !cancelled() && needs.changes.outputs.push_covered != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.codecov.io:443
            api.github.com:443
            cli.codecov.io:443
            github.com:443
            ingest.codecov.io:443
            keybase.io:443
            results-receiver.actions.githubusercontent.com:443
            storage.googleapis.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve Go coverage artifact
        id: coverage-artifact
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: bash scripts/ci/resolve-go-coverage.sh
        continue-on-error: true

      - name: Download Go test artifacts
        id: coverage-download
        if: steps.coverage-artifact.outcome == 'success'
        # Resolve the actual producer attempt when only downstream jobs rerun.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ steps.coverage-artifact.outputs.artifact_id }}
          merge-multiple: true
          path: artifacts/go-test
        continue-on-error: true

      - name: Validate Go coverage profile
        id: coverage-profile
        if: steps.coverage-download.outcome == 'success'
        run: |
          if [ ! -s artifacts/go-test/coverage.out ]; then
            echo "::error::Go coverage profile is missing or empty; Codecov upload skipped."
            exit 1
          fi
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: steps.coverage-profile.outcome == 'success'
        # Tokenless OIDC upload -- no CODECOV_TOKEN to store or rotate, and
        # skipped implicitly on fork PRs (no id-token grant). Non-gating by
        # design: the vendor-free coverage floor enforced in
        # scripts/ci/go-test.sh is the real gate, so a Codecov hiccup never
        # flakes the required "Build & Test" context.
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: artifacts/go-test/coverage.out
          use_oidc: true
          fail_ci_if_error: false
        continue-on-error: true

  secrets:
    name: "Security: Secrets"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore scanner policy from the base ref
        # A PR must not be able to alter the gate that scans it: restore the
        # scanner script and ignore policy from the protected base ref, so
        # policy changes only take effect after they merge.
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/${BASE_REF}"
          git checkout FETCH_HEAD -- scripts/scan-secrets.sh .gitleaks.toml .gitleaksignore

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_LINUX_X64_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
        run: |
          set -euo pipefail

          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${install_dir}"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "${archive}"
          printf '%s  %s\n' "${GITLEAKS_LINUX_X64_SHA256}" "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${install_dir}" gitleaks
          "${install_dir}/gitleaks" version
          printf '%s\n' "${install_dir}" >> "${GITHUB_PATH}"

      - name: Scan secrets
        run: scripts/scan-secrets.sh

  codeql:
    name: "CodeQL Analysis"
    # Keep this job local: the explicit category preserves the default-branch
    # code-scanning identity while the organization workflow is canaried.
    if: github.event.repository.visibility == 'public' && (github.event_name == 'pull_request' || github.event_name == 'schedule' || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev/'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            dl.google.com:443
            github.com:443
            go.dev:443
            proxy.golang.org:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          # One non-matrix job on purpose. A matrix appends the leg value to
          # the check-run name even with a single entry (drydock requires
          # "SAST: CodeQL (javascript-typescript)" for exactly this reason), so
          # a matrix here would post "CodeQL Analysis (go)" and never the bare
          # "CodeQL Analysis" this repo's ruleset requires, wedging every PR.
          # javascript-typescript extracts untraced alongside the traced Go
          # build below, with no npm install and no extra egress: the CodeQL
          # bundle ships every extractor. build-mode is deliberately unset --
          # codeql-action only accepts it for single-language jobs.
          languages: actions, go, javascript-typescript
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build Go
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370  # v4.39.1
        with:
          category: .github/workflows/ci.yml:codeql

  dependency-review:
    name: "Dependency Review"
    if: >-
      github.event.repository.visibility == 'public' &&
      (github.event_name == 'pull_request' ||
       (github.event_name == 'push' && !github.event.deleted &&
        (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/dev/'))))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            api.deps.dev:443
            api.github.com:443
            api.securityscorecards.dev:443
            github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The first push that creates a dev/* branch reports github.event.before
      # as the all-zero SHA, which the compare API can't resolve, hard-failing
      # the job below. Fall back to the default branch in that case. BEFORE and
      # DEFAULT_BRANCH are env-passed rather than interpolated into the run:
      # script directly, since both come from event payload fields.
      - name: Resolve base ref
        id: base-ref
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            base="$DEFAULT_BRANCH"
          else
            base="$BEFORE"
          fi
          echo "base=$base" >> "$GITHUB_OUTPUT"

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          base-ref: ${{ github.event_name == 'push' && steps.base-ref.outputs.base || '' }}
          head-ref: ${{ github.event_name == 'push' && github.sha || '' }}

  # scripts/package-release-config-test.sh is also run by release-cut.yml, and
  # that remains the gate that blocks a bad tag. The problem it doesn't solve is
  # timing: release-cut only runs when a tag is being cut, so a change that
  # breaks the contract stayed green from the PR that introduced it until
  # someone tried to ship, and the person who has to fix it is whoever is
  # mid-release rather than whoever wrote it.
  #
  # Deliberately carries no `if:` condition. A required context that evaluates
  # to skipped reports SKIPPED rather than success, and on a promotion PR the
  # push run and the PR run race to be last — which is how a required check
  # ended up blocking a merge here before. Always running is what keeps that
  # from recurring.
  release-contract:
    name: "Release Contract"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The contract script checks that every vX.Y.Z tag still has its
          # CHANGELOG heading and fails hard when it sees no tags at all, so
          # a shallow clone (which carries none) would fail this job on every
          # PR. Full depth brings the tags along.
          fetch-depth: 0

      # Pure grep/awk/shasum over files already in the checkout, so the only
      # network this job needs is the clone itself.
      - name: Verify the package release contract
        run: bash scripts/package-release-config-test.sh

      # Archives under docs/content/docs/vX.Y/ must still be byte copies of the
      # docs at their recorded release tag. Needs the full-depth checkout above
      # for the tags; with no archives it only checks the rules that need none.
      - name: Verify the docs archive contract
        run: bash scripts/docs-archive-config-test.sh

      # Drives the Compose containerd check against a fake `go` on PATH and
      # canned build info, so it needs no toolchain and no network.
      - name: Verify the Compose containerd check
        run: bash scripts/compose-containerd-version-test.sh
