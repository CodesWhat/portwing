# Static-surface passive DAST baseline for the public sites, per the org's
# tiered DAST standard: marketing + docs are Next.js static exports with no
# server, no auth, and no cookies, so a passive baseline is the appropriate
# tier — an active scan would find nothing an active application wouldn't
# already need, and testssl is N/A (Vercel terminates TLS; Portwing owns no
# certificate or listener to test). Scheduled-advisory tier, not a PR gate.
name: "Security: ZAP Baseline"

on:
  workflow_dispatch:
  schedule:
    - cron: '15 7 * * 1'  # Weekly on Monday at 07:15 UTC

permissions:
  contents: read

jobs:
  zap-baseline:
    name: "Security: ZAP Baseline"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            ghcr.io:443
            pkg-containers.githubusercontent.com:443
            portwing.codeswhat.com:443
            raw.githubusercontent.com:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: https://portwing.codeswhat.com
          docker_name: ghcr.io/zaproxy/zaproxy@sha256:2ec1d5d5b44d55cfd02ba9b89cd26852f06d92b7fc0ce9f064b9463babc73074  # stable digest, 2026-05-28
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true

      - name: Upload ZAP HTML report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: zap-baseline-html-${{ github.run_id }}
          path: report_html.html
