[SERVICE]
    Flush         1
    Log_Level     info
    Parsers_File  parsers.conf
    HTTP_Server   On
    HTTP_Listen   0.0.0.0
    HTTP_Port     2020
    Health_Check  On

[INPUT]
    Name              tail
    Path              /var/log/portwing/audit.ndjson
    Tag               portwing.audit
    Parser            json
    DB                /var/lib/fluent-bit/audit.db
    Read_from_Head    true
    Refresh_Interval  2

# The stdout output makes the example immediately runnable and hands records to
# the container runtime's log collector. Replace this block with the supported
# HTTP, OpenTelemetry, S3, Kafka, or SIEM output used by your environment.
[OUTPUT]
    Name   stdout
    Match  portwing.audit
