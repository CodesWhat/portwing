global:
  scrape_interval: 15s

scrape_configs:
  - job_name: portwing-standard
    scheme: https
    metrics_path: /metrics
    static_configs:
      - targets: ["portwing-standard:3000"]
    authorization:
      type: Bearer
      credentials_file: /run/secrets/portwing_token
    tls_config:
      ca_file: /run/secrets/portwing_tls_cert
      server_name: portwing-standard
