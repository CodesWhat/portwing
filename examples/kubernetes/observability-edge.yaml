# Prometheus scraper for kubernetes/edge.yaml. The unauthenticated Edge
# operations listener also exposes retained audit records, so the agent manifest
# uses a headless Service plus NetworkPolicy that admits only this labeled pod.
# Control traffic still dials Drydock outbound; no external Service is created.
apiVersion: v1
kind: ConfigMap
metadata:
  name: portwing-prometheus-edge
  namespace: portwing
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: portwing-edge
        scheme: http
        metrics_path: /metrics
        dns_sd_configs:
          - names:
              - portwing-edge-operations.portwing.svc.cluster.local
            type: A
            port: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portwing-prometheus
  namespace: portwing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: portwing-prometheus
  template:
    metadata:
      labels:
        app: portwing-prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: prom/prometheus:v3.10.0-distroless@sha256:4d2174874988fe0d8356fa5c799210767661a2ffce6bb03cdc64306f6579d7b9
          args:
            - --config.file=/etc/prometheus/prometheus.yml
            - --storage.tsdb.path=/prometheus
          ports:
            - name: http
              containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
            - name: data
              mountPath: /prometheus
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: http
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: portwing-prometheus-edge
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: portwing-prometheus
  namespace: portwing
spec:
  type: ClusterIP
  selector:
    app: portwing-prometheus
  ports:
    - name: http
      port: 9090
      targetPort: http
