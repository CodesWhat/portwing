# Portwing — edge mode: outbound WebSocket tunnel to Drydock.
# No host port or externally reachable Service is created; the agent dials out,
# so it works behind NAT and firewalls. A headless operations Service exists
# only for Prometheus discovery and is isolated by NetworkPolicy. The Edge
# operations listener is unauthenticated and includes the audit export, so do
# not weaken that policy or expose the Service without an authenticating proxy.
#
# Edge mode against Drydock v1.6.0-rc.11+ is Ed25519-only: the controller's
# /api/portwing/ws endpoint rejects token-based hellos. Generate a keypair
# and register its public key with Drydock before applying this manifest:
#
#   kubectl create namespace portwing --dry-run=client -o yaml | kubectl apply -f -
#   portwing keygen -comment "edge-host-01" > portwing_ed25519.pem
#   kubectl -n portwing create secret generic portwing-key \
#     --from-file=portwing_ed25519.pem=portwing_ed25519.pem
#
# Then apply:
#   kubectl apply -f kubernetes/edge.yaml
---
apiVersion: v1
kind: Namespace
metadata:
  name: portwing
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: portwing-audit-forwarder
  namespace: portwing
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush 1
        Log_Level info
        Parsers_File parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On
    [INPUT]
        Name tail
        Path /var/log/portwing/audit.ndjson
        Tag portwing.audit
        Parser json
        DB /var/lib/fluent-bit/audit.db
        Read_from_Head true
    [OUTPUT]
        Name stdout
        Match portwing.audit
---
# DaemonSet: one edge agent per Docker-capable node, all dialing out to Drydock.
# The AGENT_NAME is derived from the node name via the Downward API so each
# instance self-identifies uniquely to the controller — no manual per-node config.
#
# Target only nodes that run Docker and expose /var/run/docker.sock.
# Apply the label: kubectl label node <node> portwing.dev/docker=true
# See the README caveat on containerd/CRI-O nodes.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: portwing-edge
  namespace: portwing
  labels:
    app: portwing-edge
    app.kubernetes.io/name: portwing
    app.kubernetes.io/component: edge-agent
spec:
  selector:
    matchLabels:
      app: portwing-edge
  template:
    metadata:
      labels:
        app: portwing-edge
        app.kubernetes.io/name: portwing
        app.kubernetes.io/component: edge-agent
    spec:
      nodeSelector:
        portwing.dev/docker: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
        # Uncomment and set to the GID of /var/run/docker.sock on the node
        # so the non-root process can open the socket. Check with:
        #   stat -c '%g' /var/run/docker.sock
        # supplementalGroups: [999]
      containers:
        - name: portwing
          image: ghcr.io/codeswhat/portwing:latest
          imagePullPolicy: Always
          # Private operations port only; no host port is published. The Edge
          # listener has no inbound auth and includes audit export as well as
          # health/metrics, so NetworkPolicy below limits who can reach it.
          ports:
            - name: operations
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: DRYDOCK_URL
              value: https://drydock.example.com
            # Explicit opt-in for the NetworkPolicy-isolated operations Service.
            # Edge mode otherwise defaults this unauthenticated listener to loopback
            # and refuses to start on a non-loopback bind, so the acknowledgement
            # below is required alongside it.
            - name: BIND_ADDRESS
              value: "0.0.0.0"
            - name: ALLOW_UNAUTHENTICATED_REMOTE
              value: "true"
            - name: PRIVATE_KEY_FILE
              value: /etc/portwing/portwing_ed25519.pem
            - name: AGENT_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: AUDIT_LOG
              value: /var/log/portwing/audit.ndjson
            - name: AUDIT_BUFFER_SIZE
              value: "4096"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
              readOnly: true
            - name: portwing-key
              mountPath: /etc/portwing
              readOnly: true
            - name: audit-log
              mountPath: /var/log/portwing
            - name: tmp
              mountPath: /tmp
            - name: stacks
              mountPath: /data/stacks
          livenessProbe:
            exec:
              command:
                - wget
                - -q
                - --spider
                - http://127.0.0.1:3000/health
            initialDelaySeconds: 10
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - wget
                - -q
                - --spider
                - http://127.0.0.1:3000/ready
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
        - name: audit-forwarder
          image: cr.fluentbit.io/fluent/fluent-bit:5.0.6@sha256:1abcf78fe8c9dee0c57fc2199693370a5a1f84e0af4716beddcd153b40cbbbb1
          args: [-c, /fluent-bit/etc/portwing.conf]
          securityContext:
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: audit-forwarder-config
              mountPath: /fluent-bit/etc/portwing.conf
              subPath: fluent-bit.conf
              readOnly: true
            - name: audit-log
              mountPath: /var/log/portwing
              readOnly: true
            - name: audit-forwarder-state
              mountPath: /var/lib/fluent-bit
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 2020
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 2020
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
            type: Socket
        - name: portwing-key
          secret:
            secretName: portwing-key
            items:
              - key: portwing_ed25519.pem
                path: portwing_ed25519.pem
        - name: tmp
          emptyDir: {}
        - name: audit-log
          emptyDir: {}
        - name: audit-forwarder-state
          emptyDir: {}
        - name: audit-forwarder-config
          configMap:
            name: portwing-audit-forwarder
        # Compose stacks must survive pod restarts: down/ps/stop/restart/logs
        # reuse the compose file an earlier `up` wrote here, so this must NOT be
        # an emptyDir (which is wiped on pod recreation). hostPath keeps each
        # node's stacks on that node's disk. fsGroup does not apply to hostPath,
        # so pre-create the directory owned by the non-root UID on each node:
        #   sudo install -d -o 65532 -g 65532 /var/lib/portwing/stacks
        - name: stacks
          hostPath:
            path: /var/lib/portwing/stacks
            type: DirectoryOrCreate
---
# Headless discovery for Prometheus. Edge control traffic remains outbound over
# the Drydock WebSocket and no ClusterIP, NodePort, or LoadBalancer is created.
# The NetworkPolicy below is the enforcement boundary; use a CNI that enforces
# Kubernetes NetworkPolicy before relying on this example in a shared cluster.
apiVersion: v1
kind: Service
metadata:
  name: portwing-edge-operations
  namespace: portwing
spec:
  clusterIP: None
  # Keep disconnected agents discoverable so Prometheus can alert on
  # portwing_edge_controller_connected == 0 even while readiness is false.
  publishNotReadyAddresses: true
  selector:
    app: portwing-edge
  ports:
    - name: operations
      port: 3000
      targetPort: operations
---
# Only the example Prometheus pod may reach the unauthenticated Edge operations
# listener. Kubelet health probes for the Fluent Bit sidecar use Kubernetes'
# node-to-pod probe path and do not require a broad pod-ingress rule for 2020.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: portwing-edge-operations
  namespace: portwing
spec:
  podSelector:
    matchLabels:
      app: portwing-edge
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: portwing-prometheus
      ports:
        - protocol: TCP
          port: 3000
