# Grype reports module-level findings for stripped Go binaries even when the
# affected package is not linked. Keep those exceptions version- and
# location-scoped so dependency updates automatically force a new review. CI
# separately rejects any source dependency or shipped binary that links openpgp.
#
# 2026-09-02 image audit: the first live run of the weekly published-image
# rescan (run 33697361140) failed both gating legs of the published v0.9.11
# image on GHSA-vp52-pcj8-j9qc / CVE-2026-84304, google.golang.org/grpc v1.83.0
# HIGH. Portwing's own module graph has no grpc in it at all (`go list -m all`
# on dev/v0.9 and main), and `go version -m` on the extracted amd64 and arm64
# binaries puts the carrier in Wolfi's docker-compose (v5.5.0+dirty), so the
# entry below is scoped to that third-party binary exactly like the
# docker/docker ones. Nothing exists to bump to: docker/compose's newest
# release is v5.5.0 (2026-08-17) and pins grpc v1.83.0, Wolfi's newest package
# 5.5.0-r4 still embeds v1.83.0, and the advisory's vulnerable range is
# <= 1.83.0 so no older Compose is any better. compose@main has already moved
# to grpc v1.83.2, so the fix arrives with the next Compose release; the
# version pin below is what forces the re-review when Wolfi ships it.
# go-vulndb had assigned no GO- alias for this advisory as of 2026-09-02
# (checked against osv.dev). Pair one in below the moment it appears, the same
# way GO-2026-4883 and GO-2026-4887 are paired, or an alias flip in the Grype
# database silently reopens the gate.
#
# 2026-09-02: x/crypto moved v0.55.0 -> v0.56.0 to clear GO-2026-6354 and
# GO-2026-6355 (CVE-2026-78662, CVE-2026-56855), both x/crypto/ssh channel
# deadlock DoS advisories that the pre-push qlty osv-scanner gate began
# failing on the day they published. Same shape as the 08-28 move below:
# portwing imports only x/crypto/argon2, source-mode govulncheck reports no
# called vulnerabilities, and v0.56.0 is the fix line. The two GO-2026-5932
# pins tracking our module and binary moved in lockstep again.
#
# 2026-08-28 audit: x/crypto moved v0.54.0 -> v0.55.0 to clear GO-2026-6303
# (CVE-2026-56854), which the pre-push qlty gate began failing on. That
# advisory is scoped to golang.org/x/crypto/ssh (symbols NewServerConn,
# connection.serverAuthenticate) and portwing imports only x/crypto/argon2, so
# it was never reachable — source-mode govulncheck reports zero called
# vulnerabilities — but v0.55.0 is the fix line, so taking it is cheaper than
# carrying another suppression. The two GO-2026-5932 entries below that track
# portwing's own module and shipped binary moved to v0.55.0 in lockstep; the
# third stays pinned to v0.54.0 because it describes the Wolfi-packaged
# docker-compose binary, whose embedded x/crypto is not ours to bump.
ignore:
  # GO-2026-5932 affects only golang.org/x/crypto/openpgp. Portwing imports
  # x/crypto/argon2 only (confirmed by source-mode govulncheck), and Docker
  # Compose v5.4.0's shipped binary does not link openpgp (confirmed by
  # scripts/verify-scanner-exclusions.sh against the extracted binary). There
  # is no fixed x/crypto version because the advisory deprecates that package.
  - vulnerability: GO-2026-5932
    reason: "Portwing uses x/crypto/argon2 only; scripts/verify-scanner-exclusions.sh guards source and binary linkage. Review if x/crypto changes from v0.56.0."
    package:
      name: golang.org/x/crypto
      version: v0.56.0
      type: go-module
      location: "/go.mod"
  - vulnerability: GO-2026-5932
    reason: "Portwing uses x/crypto/argon2 only; scripts/verify-scanner-exclusions.sh guards source and binary linkage. Review if x/crypto changes from v0.56.0."
    package:
      name: golang.org/x/crypto
      version: v0.56.0
      type: go-module
      location: "**/usr/bin/portwing"
  - vulnerability: GO-2026-5932
    reason: "Docker Compose v5.4.0 does not link openpgp; scripts/verify-scanner-exclusions.sh inspects the shipped binary. Review when Wolfi changes x/crypto from v0.54.0."
    package:
      name: golang.org/x/crypto
      version: v0.54.0
      type: go-module
      location: "**/usr/bin/docker-compose"

  # Grype reports Go module vulnerabilities embedded in the third-party
  # docker-compose executable packaged from Wolfi. Keep these ignores scoped
  # to that binary and review them when Wolfi ships updated packages.
  #
  # 2026-08-11 audit: Wolfi's docker-compose package moved from v5.3.1 to
  # v5.4.0-r0, which vendors golang.org/x/net v0.57.0 (>= the v0.55.0 fix for
  # GO-2026-5025/5026/5027/5028/5029/5030), github.com/docker/cli v29.6.2
  # (>= the v29.2.0 fix for GO-2026-4610), and docker-compose itself is past
  # the v5.1.0 fix line for that same advisory — all now upstream-fixed, so
  # those six x/net entries and the docker/cli entry were dropped as dead
  # config (confirmed zero matches via `grype dir:<extracted docker-compose
  # binary> --config .grype.yaml`). Grype selected the GHSA identifiers for
  # GO-2026-4883 and GO-2026-4887 through 2026-08-27, then selected the latter's
  # Go alias on 2026-08-28. Keep both ID pairs scoped below so database alias
  # selection cannot flip the release gate again. The five GHSA entries remain
  # genuinely open: github.com/docker/docker
  # v28.5.2+incompatible is still vendored, and none has a fix on that legacy
  # import path — only the github.com/moby/moby/v2 rewrite is patched, which is
  # Wolfi's call, not portwing's.
  #
  # 2026-08-16 audit (code-scanning alert 191): the v5.4.0 compose binary
  # embeds x/crypto v0.54.0, so the GO-2026-5932 ignore above was re-scoped
  # from v0.53.0 after re-confirming openpgp is not linked
  # (scripts/verify-scanner-exclusions.sh against the extracted binary). The
  # GO-2026-5841 klauspost/compress entry was dropped as dead config: v5.4.0
  # embeds v1.19.1, past the v1.18.7 fix line, so the advisory no longer
  # matches at all.
  - vulnerability: GHSA-pxq6-2prw-chj9
    reason: "Docker Engine daemon plugin-install advisory; the shipped Docker Compose executable is a client and does not link daemon/pkg/plugin. Wolfi still vendors docker/docker v28.5.2+incompatible. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GO-2026-4883
    reason: "Go-vulndb alias of GHSA-pxq6-2prw-chj9; Docker Compose is a client and does not link the affected Docker Engine daemon/pkg/plugin package. Wolfi still vendors docker/docker v28.5.2+incompatible. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GHSA-x744-4wpc-v9h2
    reason: "Docker Engine daemon AuthZ-plugin advisory; the shipped Docker Compose executable is a client and cannot host daemon authorization plugins. Wolfi still vendors docker/docker v28.5.2+incompatible. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GO-2026-4887
    reason: "Go-vulndb alias of GHSA-x744-4wpc-v9h2; Docker Compose is a client and cannot host the affected Docker Engine daemon AuthZ plugins. Wolfi still vendors docker/docker v28.5.2+incompatible. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GHSA-vp62-88p7-qqf5
    reason: "Embedded in Wolfi docker-compose binary (docker/docker v28.5.2+incompatible, legacy import path); no fix exists on that path, only the moby/moby/v2 rewrite (2.0.0-beta.14) is patched. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GHSA-rg2x-37c3-w2rh
    reason: "Embedded in Wolfi docker-compose binary (docker/docker v28.5.2+incompatible, legacy import path); no fix exists on that path, only the moby/moby/v2 rewrite (2.0.0-beta.14) is patched. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GHSA-x86f-5xw2-fm2r
    reason: "Embedded in Wolfi docker-compose binary (docker/docker v28.5.2+incompatible, legacy import path); no fix exists on that path, only the moby/moby/v2 rewrite (2.0.0-beta.14) is patched. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"

  # GHSA-vp52-pcj8-j9qc / CVE-2026-84304 is a heap-exhaustion DoS: an
  # unauthenticated peer fragments its payload across millions of tiny HTTP/2
  # DATA frames on concurrent multiplexed streams and each fragment costs a
  # separate recvMsg in grpc's shared internal/transport recvBuffer.
  #
  # Unlike the openpgp entries above this is NOT a linkage argument, and saying
  # so plainly matters: grpc's server code *is* linked into the shipped Compose
  # binary. `go tool nm` finds google.golang.org/grpc.(*Server).Serve, and the
  # pclntab carries internal/transport/http2_server.go. The argument is
  # reachability. The only gRPC server Compose can run is BuildKit's session
  # (the registered services are moby.filesync.v1 and moby.buildkit.v1), and
  # that is served over the single already-established hijacked /session
  # connection to the Docker daemon the operator configured, never a network
  # listener, so the unauthenticated-remote position the advisory describes does
  # not exist. Its gRPC clients dial only operator-configured endpoints:
  # buildkitd through that same daemon, and the OTLP trace exporter, which this
  # image sets no endpoint for. Portwing runs Compose as a short-lived
  # subprocess per request (internal/docker/compose.go, buildCommand) via
  # exec.CommandContext, sharing this container's memory cgroup rather than one
  # of its own, so a cgroup-level OOM kill can take down the whole container,
  # not just Compose. The argument here is not isolation, it's reachability:
  # there is no listener for an unauthenticated peer to hit.
  #
  # Version-scoped, so the pin keeps this ignore from silently following
  # whatever grpc Wolfi's Compose package embeds next; once the version drifts,
  # the weekly rescan stops matching and this entry goes dead rather than
  # forcing a review on its own. The dated review deadline is what actually
  # drives cleanup: review when Wolfi ships a Compose past v5.5.0, or by
  # 2026-11-15 alongside the docker/docker entries above, whichever is sooner.
  - vulnerability: GHSA-vp52-pcj8-j9qc
    reason: "Embedded in the Wolfi docker-compose binary; Compose's only gRPC server is BuildKit's session over the hijacked Docker /session connection, never a network listener, and its gRPC clients dial only operator-configured endpoints. No fixed Compose release exists yet (v5.5.0 pins grpc v1.83.0; compose@main is already on v1.83.2). Review when Wolfi ships a Compose past v5.5.0, or by 2026-11-15."
    package:
      name: google.golang.org/grpc
      version: v1.83.0
      type: go-module
      location: "**/usr/bin/docker-compose"

  # CVE-2026-54876 is a memory leak in OpenSSL's TLS *client* OCSP response
  # checking — a feature the application must opt into. Nothing in this image
  # can enable it: portwing, docker-cli, and docker-compose are static Go
  # binaries (Go crypto, no libssl linkage), and libssl's only consumers are
  # busybox and wget, whose binaries contain no OCSP code at all (verified by
  # string inspection of the shipped wget). The image's sole TLS-client use is
  # the HEALTHCHECK wget against portwing's own localhost listener. No fixed
  # package exists to bump to: upstream OpenSSL has only fix commits, Wolfi's
  # secdb declares no fixed version, and grype matches these via NVD CPE
  # fallback, so even the 3.6.3-r4 rebuild would still match. Version-scoped
  # so a Wolfi openssl bump forces re-review. Review by 2026-09-15 or when
  # Wolfi publishes an openssl secfix for this CVE, whichever is sooner.
  #
  # 2026-08-17 re-review: the release image at the time picked up Wolfi's
  # 3.6.3-r4 rebuild and the version pin fired as designed. r4 is a
  # rebuild, not a secfix — Wolfi's secdb still declares no fixed version
  # for this CVE and the CPE fallback matched r4 exactly as predicted
  # above. Re-verified the shipped wget contains zero OCSP references;
  # rationale unchanged, entries re-scoped to 3.6.3-r4. Review deadline
  # unchanged (2026-09-15).
  - vulnerability: CVE-2026-54876
    reason: "Opt-in OCSP-checking TLS client leak; no libssl consumer in the image implements OCSP checking and no fixed Wolfi package exists yet. Review by 2026-09-15."
    package:
      name: libcrypto3
      version: 3.6.3-r4
      type: apk
  - vulnerability: CVE-2026-54876
    reason: "Opt-in OCSP-checking TLS client leak; no libssl consumer in the image implements OCSP checking and no fixed Wolfi package exists yet. Review by 2026-09-15."
    package:
      name: libssl3
      version: 3.6.3-r4
      type: apk

  # CVE-2026-14456 is a DoS in OpenSSL's QUIC *server* role: an unauthenticated
  # peer flooding Initial packets at a Listener SSL object makes it queue
  # unbounded per-channel state. Read the advisory text directly rather than
  # inferring from the CVSS score — the vector is entirely server-side QUIC.
  # Nothing in this image is a QUIC server. Re-verified per-binary with
  # `objdump -p` on the extracted images rather than reasoning from the
  # Dockerfile: docker, docker-compose, and busybox link only libc (musl on the
  # armv7 leg), so wget is the sole libssl.so.3/libcrypto.so.3 consumer, and the
  # shipped wget has no QUIC support at all (no quic/http3 strings). Its only
  # invocation is Dockerfile.release's HEALTHCHECK against portwing's own
  # loopback listener.
  #
  # No fixed package exists to bump to on either base: grype reports fix state
  # "unknown", Wolfi's secdb has no secfix past 3.6.3-r4, and Alpine ships
  # 3.5.7-r0 on both 3.24 and edge while the upstream fix line is 3.5.8/3.6.4.
  # Entries are version-scoped per base so either distro shipping a fix forces
  # re-review. Review by 2026-09-15, alongside the CVE-2026-54876 entries.
  - vulnerability: CVE-2026-14456
    reason: "QUIC-server DoS; wget is the image's only libssl/libcrypto consumer (objdump-verified) and has no QUIC support. No fixed Wolfi package exists yet. Review by 2026-09-15."
    package:
      name: libcrypto3
      version: 3.6.3-r4
      type: apk
  - vulnerability: CVE-2026-14456
    reason: "QUIC-server DoS; wget is the image's only libssl/libcrypto consumer (objdump-verified) and has no QUIC support. No fixed Wolfi package exists yet. Review by 2026-09-15."
    package:
      name: libssl3
      version: 3.6.3-r4
      type: apk
  # armv7 leg: Alpine ships older OpenSSL than Wolfi, so the same CVE matches a
  # different version and needs its own scoped entry.
  - vulnerability: CVE-2026-14456
    reason: "armv7 (Alpine) leg of the same QUIC-server DoS; wget is again the only libssl/libcrypto consumer, objdump-verified on the armv7 binaries. No fixed Alpine package on 3.24 or edge. Review by 2026-09-15."
    package:
      name: libcrypto3
      version: 3.5.7-r0
      type: apk
  - vulnerability: CVE-2026-14456
    reason: "armv7 (Alpine) leg of the same QUIC-server DoS; wget is again the only libssl/libcrypto consumer, objdump-verified on the armv7 binaries. No fixed Alpine package on 3.24 or edge. Review by 2026-09-15."
    package:
      name: libssl3
      version: 3.5.7-r0
      type: apk
