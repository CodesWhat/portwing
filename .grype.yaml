# Grype reports module-level findings for stripped Go binaries even when the
# affected package is not linked. Keep those exceptions version- and
# location-scoped so dependency updates automatically force a new review. CI
# separately rejects any source dependency or shipped binary that links openpgp.
#
# 2026-09-02: x/crypto moved v0.55.0 -> v0.56.0 to clear GO-2026-6354 and
# GO-2026-6355 (CVE-2026-78662, CVE-2026-56855), both x/crypto/ssh channel
# deadlock DoS advisories that the pre-push qlty osv-scanner gate began
# failing on the day they published. Same shape as the 08-28 move below:
# portwing imports only x/crypto/argon2, source-mode govulncheck reports no
# called vulnerabilities, and v0.56.0 is the fix line. The two GO-2026-5932
# pins tracking our module and binary moved in lockstep again.
#
# 2026-08-28 audit: x/crypto moved v0.54.0 -> v0.55.0 to clear GO-2026-6303
# (CVE-2026-56854), which the pre-push qlty gate began failing on. That
# advisory is scoped to golang.org/x/crypto/ssh (symbols NewServerConn,
# connection.serverAuthenticate) and portwing imports only x/crypto/argon2, so
# it was never reachable — source-mode govulncheck reports zero called
# vulnerabilities — but v0.55.0 is the fix line, so taking it is cheaper than
# carrying another suppression. The two GO-2026-5932 entries below that track
# portwing's own module and shipped binary moved to v0.55.0 in lockstep; the
# third stays pinned to v0.54.0 because it describes the Wolfi-packaged
# docker-compose binary, whose embedded x/crypto is not ours to bump.
ignore:
  # GO-2026-5932 affects only golang.org/x/crypto/openpgp. Portwing imports
  # x/crypto/argon2 only (confirmed by source-mode govulncheck), and Docker
  # Compose v5.4.0's shipped binary does not link openpgp (confirmed by
  # scripts/verify-scanner-exclusions.sh against the extracted binary). There
  # is no fixed x/crypto version because the advisory deprecates that package.
  - vulnerability: GO-2026-5932
    reason: "Portwing uses x/crypto/argon2 only; scripts/verify-scanner-exclusions.sh guards source and binary linkage. Review if x/crypto changes from v0.56.0."
    package:
      name: golang.org/x/crypto
      version: v0.56.0
      type: go-module
      location: "/go.mod"
  - vulnerability: GO-2026-5932
    reason: "Portwing uses x/crypto/argon2 only; scripts/verify-scanner-exclusions.sh guards source and binary linkage. Review if x/crypto changes from v0.56.0."
    package:
      name: golang.org/x/crypto
      version: v0.56.0
      type: go-module
      location: "**/usr/bin/portwing"
  - vulnerability: GO-2026-5932
    reason: "Docker Compose v5.4.0 does not link openpgp; scripts/verify-scanner-exclusions.sh inspects the shipped binary. Review when Wolfi changes x/crypto from v0.54.0."
    package:
      name: golang.org/x/crypto
      version: v0.54.0
      type: go-module
      location: "**/usr/bin/docker-compose"

  # Grype reports Go module vulnerabilities embedded in the third-party
  # docker-compose executable packaged from Wolfi. Keep these ignores scoped
  # to that binary and review them when Wolfi ships updated packages.
  #
  # 2026-08-11 audit: Wolfi's docker-compose package moved from v5.3.1 to
  # v5.4.0-r0, which vendors golang.org/x/net v0.57.0 (>= the v0.55.0 fix for
  # GO-2026-5025/5026/5027/5028/5029/5030), github.com/docker/cli v29.6.2
  # (>= the v29.2.0 fix for GO-2026-4610), and docker-compose itself is past
  # the v5.1.0 fix line for that same advisory — all now upstream-fixed, so
  # those six x/net entries and the docker/cli entry were dropped as dead
  # config (confirmed zero matches via `grype dir:<extracted docker-compose
  # binary> --config .grype.yaml`). Grype selected the GHSA identifiers for
  # GO-2026-4883 and GO-2026-4887 through 2026-08-27, then selected the latter's
  # Go alias on 2026-08-28. Keep both ID pairs scoped below so database alias
  # selection cannot flip the release gate again. The five GHSA entries remain
  # genuinely open: github.com/docker/docker
  # v28.5.2+incompatible is still vendored, and none has a fix on that legacy
  # import path — only the github.com/moby/moby/v2 rewrite is patched, which is
  # Wolfi's call, not portwing's.
  #
  # 2026-08-16 audit (code-scanning alert 191): the v5.4.0 compose binary
  # embeds x/crypto v0.54.0, so the GO-2026-5932 ignore above was re-scoped
  # from v0.53.0 after re-confirming openpgp is not linked
  # (scripts/verify-scanner-exclusions.sh against the extracted binary). The
  # GO-2026-5841 klauspost/compress entry was dropped as dead config: v5.4.0
  # embeds v1.19.1, past the v1.18.7 fix line, so the advisory no longer
  # matches at all.
  - vulnerability: GHSA-pxq6-2prw-chj9
    reason: "Docker Engine daemon plugin-install advisory; the shipped Docker Compose executable is a client and does not link daemon/pkg/plugin. Wolfi still vendors docker/docker v28.5.2+incompatible. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GO-2026-4883
    reason: "Go-vulndb alias of GHSA-pxq6-2prw-chj9; Docker Compose is a client and does not link the affected Docker Engine daemon/pkg/plugin package. Wolfi still vendors docker/docker v28.5.2+incompatible. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GHSA-x744-4wpc-v9h2
    reason: "Docker Engine daemon AuthZ-plugin advisory; the shipped Docker Compose executable is a client and cannot host daemon authorization plugins. Wolfi still vendors docker/docker v28.5.2+incompatible. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GO-2026-4887
    reason: "Go-vulndb alias of GHSA-x744-4wpc-v9h2; Docker Compose is a client and cannot host the affected Docker Engine daemon AuthZ plugins. Wolfi still vendors docker/docker v28.5.2+incompatible. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GHSA-vp62-88p7-qqf5
    reason: "Embedded in Wolfi docker-compose binary (docker/docker v28.5.2+incompatible, legacy import path); no fix exists on that path, only the moby/moby/v2 rewrite (2.0.0-beta.14) is patched. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GHSA-rg2x-37c3-w2rh
    reason: "Embedded in Wolfi docker-compose binary (docker/docker v28.5.2+incompatible, legacy import path); no fix exists on that path, only the moby/moby/v2 rewrite (2.0.0-beta.14) is patched. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GHSA-x86f-5xw2-fm2r
    reason: "Embedded in Wolfi docker-compose binary (docker/docker v28.5.2+incompatible, legacy import path); no fix exists on that path, only the moby/moby/v2 rewrite (2.0.0-beta.14) is patched. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
