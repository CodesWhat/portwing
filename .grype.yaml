# Grype reports module-level findings for stripped Go binaries even when the
# affected package is not linked. Keep those exceptions version- and
# location-scoped so dependency updates automatically force a new review. CI
# separately rejects any source dependency or shipped binary that links openpgp.
ignore:
  # GO-2026-5932 affects only golang.org/x/crypto/openpgp. Portwing imports
  # x/crypto/argon2 only (confirmed by source-mode govulncheck), and Docker
  # Compose v5.3.1's build dependency graph does not contain openpgp. There is
  # no fixed x/crypto version because the advisory deprecates that package.
  - vulnerability: GO-2026-5932
    reason: "Portwing uses x/crypto/argon2 only; scripts/verify-scanner-exclusions.sh guards source and binary linkage. Review if x/crypto changes from v0.54.0."
    package:
      name: golang.org/x/crypto
      version: v0.54.0
      type: go-module
      location: "/go.mod"
  - vulnerability: GO-2026-5932
    reason: "Portwing uses x/crypto/argon2 only; scripts/verify-scanner-exclusions.sh guards source and binary linkage. Review if x/crypto changes from v0.54.0."
    package:
      name: golang.org/x/crypto
      version: v0.54.0
      type: go-module
      location: "**/usr/bin/portwing"
  - vulnerability: GO-2026-5932
    reason: "Docker Compose v5.3.1 does not link openpgp; scripts/verify-scanner-exclusions.sh inspects the shipped binary. Review when Wolfi changes x/crypto from v0.53.0."
    package:
      name: golang.org/x/crypto
      version: v0.53.0
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GO-2026-5841
    reason: "Docker Compose v5.3.1 does not link the affected compress/s2 package; scripts/verify-scanner-exclusions.sh inspects the shipped binary. Review when klauspost/compress changes from v1.18.6."
    package:
      name: github.com/klauspost/compress
      version: v1.18.6
      type: go-module
      location: "**/usr/bin/docker-compose"

  # Grype reports Go module vulnerabilities embedded in the third-party
  # docker-compose executable packaged from Wolfi. Keep these ignores scoped
  # to that binary and review them when Wolfi ships updated packages.
  #
  # 2026-08-11 audit: Wolfi's docker-compose package moved from v5.3.1 to
  # v5.4.0-r0, which vendors golang.org/x/net v0.57.0 (>= the v0.55.0 fix for
  # GO-2026-5025/5026/5027/5028/5029/5030), github.com/docker/cli v29.6.2
  # (>= the v29.2.0 fix for GO-2026-4610), and docker-compose itself is past
  # the v5.1.0 fix line for that same advisory — all now upstream-fixed, so
  # those six x/net entries and the docker/cli entry were dropped as dead
  # config (confirmed zero matches via `grype dir:<extracted docker-compose
  # binary> --config .grype.yaml`). GO-2026-4883 and GO-2026-4887 were also
  # dropped: they are the Go-vulndb aliases of GHSA-pxq6-2prw-chj9 and
  # GHSA-x744-4wpc-v9h2 below — Grype reports the same finding under the
  # GHSA id, so the GO- id entries never matched anything (confirmed via a
  # single-rule test config: 0 ignoredMatches). The five GHSA entries below
  # remain genuinely open: github.com/docker/docker v28.5.2+incompatible is
  # still vendored, and none of these advisories have a fix on that legacy
  # import path — only the github.com/moby/moby/v2 rewrite is patched, which
  # is Wolfi's call, not portwing's.
  - vulnerability: GHSA-pxq6-2prw-chj9
    reason: "Embedded in Wolfi docker-compose binary (docker/docker v28.5.2+incompatible, legacy import path); no fix exists on that path, only the moby/moby/v2 rewrite (2.0.0-beta.8) is patched. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GHSA-x744-4wpc-v9h2
    reason: "Embedded in Wolfi docker-compose binary (docker/docker v28.5.2+incompatible, legacy import path); fixed upstream at docker/docker v29.3.1, but Wolfi's docker-compose package still vendors v28.5.2 — no portwing-side bump available. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GHSA-vp62-88p7-qqf5
    reason: "Embedded in Wolfi docker-compose binary (docker/docker v28.5.2+incompatible, legacy import path); no fix exists on that path, only the moby/moby/v2 rewrite (2.0.0-beta.14) is patched. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GHSA-rg2x-37c3-w2rh
    reason: "Embedded in Wolfi docker-compose binary (docker/docker v28.5.2+incompatible, legacy import path); no fix exists on that path, only the moby/moby/v2 rewrite (2.0.0-beta.14) is patched. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
  - vulnerability: GHSA-x86f-5xw2-fm2r
    reason: "Embedded in Wolfi docker-compose binary (docker/docker v28.5.2+incompatible, legacy import path); no fix exists on that path, only the moby/moby/v2 rewrite (2.0.0-beta.14) is patched. Review by 2026-11-15."
    package:
      name: github.com/docker/docker
      version: v28.5.2+incompatible
      type: go-module
      location: "**/usr/bin/docker-compose"
