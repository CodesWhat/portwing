# Grype reports module-level findings for stripped Go binaries even when the
# affected package is not linked. Keep those exceptions version- and
# location-scoped so dependency updates automatically force a new review. CI
# separately rejects any source dependency or shipped binary that links openpgp.
#
# 2026-10-02 audit: the published v0.9.20 images were extracted and checked
# with `go version -m`, and Grype was run with and without this file on all
# three platforms. amd64 and arm64 ship Wolfi's docker-compose 5.5.1-r2
# (docker/compose/v5 v5.5.1, containerd/v2 v2.3.6, google.golang.org/grpc
# v1.83.2, golang.org/x/crypto v0.56.0) and carry no github.com/docker/docker
# module at all, since Compose now uses github.com/moby/moby/api and /client.
# Grype's `ignoredMatches` was empty on every platform and scanning with an
# empty ignore list gave identical results, so no image-scoped entry matched
# anything. Removed as dead config: the seven github.com/docker/docker
# v28.5.2+incompatible entries (GHSA-pxq6-2prw-chj9, GO-2026-4883,
# GHSA-x744-4wpc-v9h2, GO-2026-4887, GHSA-vp62-88p7-qqf5, GHSA-rg2x-37c3-w2rh,
# GHSA-x86f-5xw2-fm2r), the google.golang.org/grpc v1.83.0 entry
# (GHSA-vp52-pcj8-j9qc, fixed in the v1.83.2 that Compose now carries), and the
# docker-compose GO-2026-5932 entry pinned to x/crypto v0.54.0, which a v0.56.0
# re-pin would not have matched either. verify-scanner-exclusions.sh still
# checks the shipped Compose binary for openpgp, so linkage stays guarded
# without a suppression. Only the two portwing-owned GO-2026-5932 entries
# (/go.mod and **/usr/bin/portwing, x/crypto v0.57.0) match anything. The
# arm/v7 image builds Compose from source and carried containerd v2.3.5; that
# is fixed by rebuilding on v2.3.6, not by a suppression. The 2026-11-15
# review date went away with the entries it covered, and the older dated
# paragraphs below describe entries that no longer exist.
#
# 2026-09-02 image audit: the first live run of the weekly published-image
# rescan (run 33697361140) failed both gating legs of the then-current
# published image on GHSA-vp52-pcj8-j9qc / CVE-2026-84304, google.golang.org/grpc v1.83.0
# HIGH. Portwing's own module graph has no grpc in it at all (`go list -m all`
# on dev/v0.9 and main), and `go version -m` on the extracted amd64 and arm64
# binaries puts the carrier in Wolfi's docker-compose (v5.5.0+dirty), so the
# entry (removed 2026-10-02) was scoped to that third-party binary exactly like
# the docker/docker ones. Nothing exists to bump to: docker/compose's newest
# release is v5.5.0 (2026-08-17) and pins grpc v1.83.0, Wolfi's newest package
# 5.5.0-r4 still embeds v1.83.0, and the advisory's vulnerable range is
# <= 1.83.0 so no older Compose is any better. compose@main has already moved
# to grpc v1.83.2, so the fix arrives with the next Compose release; the
# version pin below is what forces the re-review when Wolfi ships it.
# go-vulndb had assigned no GO- alias for this advisory as of 2026-09-02
# (checked against osv.dev). Pair one in below the moment it appears, the same
# way GO-2026-4883 and GO-2026-4887 are paired, or an alias flip in the Grype
# database silently reopens the gate.
#
# 2026-09-02: x/crypto moved v0.55.0 -> v0.56.0 to clear GO-2026-6354 and
# GO-2026-6355 (CVE-2026-78662, CVE-2026-56855), both x/crypto/ssh channel
# deadlock DoS advisories that the pre-push qlty osv-scanner gate began
# failing on the day they published. Same shape as the 08-28 move below:
# portwing imports only x/crypto/argon2, source-mode govulncheck reports no
# called vulnerabilities, and v0.56.0 is the fix line. The two GO-2026-5932
# pins tracking our module and binary moved in lockstep again.
#
# 2026-08-28 audit: x/crypto moved v0.54.0 -> v0.55.0 to clear GO-2026-6303
# (CVE-2026-56854), which the pre-push qlty gate began failing on. That
# advisory is scoped to golang.org/x/crypto/ssh (symbols NewServerConn,
# connection.serverAuthenticate) and portwing imports only x/crypto/argon2, so
# it was never reachable — source-mode govulncheck reports zero called
# vulnerabilities — but v0.55.0 is the fix line, so taking it is cheaper than
# carrying another suppression. The two GO-2026-5932 entries below that track
# portwing's own module and shipped binary moved to v0.55.0 in lockstep; the
# third (removed 2026-10-02) stayed pinned to v0.54.0 because it described the
# Wolfi-packaged docker-compose binary, whose embedded x/crypto was not ours to
# bump.
#
# 2026-08-11 audit: Wolfi's docker-compose package moved from v5.3.1 to
# v5.4.0-r0, which vendors golang.org/x/net v0.57.0 (>= the v0.55.0 fix for
# GO-2026-5025/5026/5027/5028/5029/5030), github.com/docker/cli v29.6.2
# (>= the v29.2.0 fix for GO-2026-4610), and docker-compose itself is past
# the v5.1.0 fix line for that same advisory — all now upstream-fixed, so
# those six x/net entries and the docker/cli entry were dropped as dead
# config (confirmed zero matches via `grype dir:<extracted docker-compose
# binary> --config .grype.yaml`). Grype selected the GHSA identifiers for
# GO-2026-4883 and GO-2026-4887 through 2026-08-27, then selected the latter's
# Go alias on 2026-08-28. Keep both ID pairs scoped below so database alias
# selection cannot flip the release gate again. The five GHSA entries were
# then still open: github.com/docker/docker v28.5.2+incompatible was still
# vendored, and none had a fix on that legacy import path (removed 2026-10-02).
#
# 2026-08-16 audit (code-scanning alert 191): the v5.4.0 compose binary
# embeds x/crypto v0.54.0, so the GO-2026-5932 ignore above was re-scoped
# from v0.53.0 after re-confirming openpgp is not linked
# (scripts/verify-scanner-exclusions.sh against the extracted binary). The
# GO-2026-5841 klauspost/compress entry was dropped as dead config: v5.4.0
# embeds v1.19.1, past the v1.18.7 fix line, so the advisory no longer
# matches at all.
ignore:
  # GO-2026-5932 affects only golang.org/x/crypto/openpgp. Portwing imports
  # x/crypto/argon2 only (confirmed by source-mode govulncheck), and the
  # shipped Docker Compose binary does not link openpgp (confirmed by
  # scripts/verify-scanner-exclusions.sh against the extracted binary). There
  # is no fixed x/crypto version because the advisory deprecates that package.
  - vulnerability: GO-2026-5932
    reason: "Portwing uses x/crypto/argon2 only; scripts/verify-scanner-exclusions.sh guards source and binary linkage. Review if x/crypto changes from v0.57.0."
    package:
      name: golang.org/x/crypto
      version: v0.57.0
      type: go-module
      location: "/go.mod"
  - vulnerability: GO-2026-5932
    reason: "Portwing uses x/crypto/argon2 only; scripts/verify-scanner-exclusions.sh guards source and binary linkage. Review if x/crypto changes from v0.57.0."
    package:
      name: golang.org/x/crypto
      version: v0.57.0
      type: go-module
      location: "**/usr/bin/portwing"
