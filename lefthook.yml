---
# Lefthook configuration for portwing.
#
# Pre-push pipeline (piped = sequential, fail-fast):
#   1. Clean-tree check (no stray artifacts before push)
#   2. Package release contract (docs/config agreement, sub-second)
#   3. GoReleaser snapshot dry-run (full release pipeline, skip publish)
#   4. Pinned golangci-lint through the isolated CI adapter
#   5. Qlty full-repository check
#   6. go test -race
#   7. govulncheck (reachable CVEs in deps + stdlib)
#   8. Go fuzz smoke (5 s per fuzzer, all 10 fuzzers) — tier 0 of the fuzz
#      strategy. Catches broken fuzz drivers and stale seed corpora before
#      the push leaves the machine. Real coverage tiers live in
#      .github/workflows/ci-verify.yml (60 s, every push/PR) and
#      quality-fuzz-nightly.yml (5 m, daily).
#   9. actionlint + zizmor (workflow correctness + security)
#  10. Web analytics contract, lint, knip dead-code scan, and production
#      static build
#
# Tools that may not be installed locally (goreleaser, govulncheck,
# actionlint, zizmor) are skipped when absent — CI still enforces them.

commit-msg:
  commands:
    convention:
      run: scripts/validate-commit-msg.sh {1}
      fail_text: "Commit message does not follow Conventional Commits format"

pre-commit:
  piped: true
  commands:
    gofmt:
      glob: "*.go"
      run: |
        out="$(gofmt -l {staged_files})"
        if [ -n "$out" ]; then
          echo "gofmt needed on:"
          echo "$out"
          exit 1
        fi

pre-push:
  piped: true
  commands:
    clean-tree:
      run: |
        if ! git diff --quiet --exit-code || ! git diff --cached --quiet --exit-code; then
          echo "Uncommitted changes detected — commit or stash before pushing."
          exit 1
        fi
      fail_text: "Uncommitted changes detected"
      priority: 0
      timeout: 10s

    # The package release contract, run here as well as in release-cut.yml.
    # release-cut.yml is the gate that matters, but it only runs when a tag is
    # being cut, so a README or docs change that breaks the contract sat green
    # from the PR that introduced it until someone tried to ship. This is pure
    # grep and awk against files already on disk, so it costs well under a
    # second and belongs ahead of the three-minute goreleaser run.
    release-contract:
      run: bash scripts/package-release-config-test.sh
      fail_text: "Package release contract broken — see the FAIL lines above"
      priority: 1
      timeout: 30s

    # Full release dry-run — mirrors what release.yml runs in CI, minus
    # publish. Catches goreleaser config, build, archive, and dirty-tree
    # bugs locally before they surface in a tagged release.
    goreleaser-snapshot:
      run: goreleaser release --snapshot --clean --skip=sign,docker,publish,sbom
      skip:
        - run: '! command -v goreleaser >/dev/null 2>&1'
      priority: 2
      timeout: 3m

    go-lint:
      run: ./scripts/ci/go-lint.sh
      priority: 3
      timeout: 4m

    qlty:
      run: ./scripts/qlty-check-gate.sh all
      priority: 4
      timeout: 4m

    # -count=1 disables the test cache. Without it a cached pass can be served
    # for a package whose source changed only in ways the cache key misses,
    # so a newly-introduced race is reported as green locally. CI runs on a
    # cold cache; this keeps the local gate honest about what it checked.
    go-test:
      run: go test -race -count=1 ./...
      priority: 5
      timeout: 5m

    govulncheck:
      run: govulncheck ./...
      skip:
        - run: '! command -v govulncheck >/dev/null 2>&1'
      priority: 6
      timeout: 2m

    # Fuzz smoke — 5 s per fuzzer, all 10 in series. Keep a finite Go
    # watchdog above the tiny smoke budget so a hung input fails with a
    # stack dump instead of consuming the hook timeout.
    #
    # Cap worker count below the core count: Go fuzzing defaults to one worker
    # per GOMAXPROCS, and on a many-core machine that pins every core, starving
    # the coordinator goroutine until a worker misses its sync deadline and the
    # run dies with a spurious "context deadline exceeded". Always leave at
    # least one core for the coordinator — max(1, min(4, cores-1)) — which holds
    # even at 4 cores; cap at 4 since a 5 s smoke needs no more. It only has to
    # catch broken drivers / stale corpora; coverage tiers live in CI/nightly.
    go-fuzz:
      run: |
        set -e
        cores=$(getconf _NPROCESSORS_ONLN 2>/dev/null || echo 4)
        workers=$(( cores > 1 ? cores - 1 : 1 ))
        [ "$workers" -gt 4 ] && workers=4
        # Retry-once-on-flake and crash classification live in
        # scripts/ci/fuzz-run.sh (PW-5.10), shared with scripts/ci/go-fuzz.sh
        # and the nightly/monthly deep-fuzz workflows. `set -e` above stops
        # this loop at the first fuzzer whose call exits non-zero, same as
        # the inline retry loop this replaced.
        for entry in \
          "FuzzParsePHC ./internal/server/" \
          "FuzzParseTrustedProxies ./internal/server/" \
          "FuzzParseImageRef ./internal/adapter/" \
          "FuzzParseLabels ./internal/adapter/drydock/" \
          "FuzzMCPHandler ./internal/mcp/" \
          "FuzzEnvelope ./internal/protocol/" \
          "FuzzVerifyRequest ./internal/auth/" \
          "FuzzDecodeContainerLogStream ./internal/docker/" \
          "FuzzComposeRequestValidate ./internal/docker/" \
          "FuzzParseKeyLine ./internal/auth/"; do
          set -- $entry
          FUZZ_RETRIES=2 FUZZ_TIMEOUT=1m FUZZ_PARALLEL="$workers" bash scripts/ci/fuzz-run.sh "$2" "$1" 5s
        done
      priority: 7
      timeout: 3m

    actionlint:
      glob: '.github/workflows/*.yml'
      run: actionlint
      skip:
        - run: '! command -v actionlint >/dev/null 2>&1'
      priority: 8
      timeout: 30s

    zizmor:
      glob: '.github/workflows/*.yml'
      run: zizmor .github/workflows/
      skip:
        - run: '! command -v zizmor >/dev/null 2>&1'
      priority: 9
      timeout: 30s

    # Runs check:web, which chains version-contract, tests, biome lint,
    # knip (dead files/exports/unlisted deps across website, docs,
    # analytics — config in knip.json), build, page-weight budget, and
    # lighthouse. CI's node-ci "Web Contract" job runs the same
    # check:web script, so knip is gated there too without a second,
    # duplicate invocation here.
    web:
      run: npm run check:web
      priority: 10
      timeout: 15m
